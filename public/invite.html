<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Invitasjon — Familieassistenten</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #eef2ff 0%, #f5f6fa 100%);
        color: #111827;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
          color: #e5e7eb;
        }
        .card {
          background: #111827;
          border-color: #1f2937;
        }
      }
      .card {
        width: min(460px, 92vw);
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 2rem;
        box-shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
      }
      h1 {
        margin: 0 0 0.25rem;
      }
      .meta {
        opacity: 0.75;
        font-size: 0.95rem;
      }
      .primary {
        width: 100%;
        margin-top: 1rem;
        padding: 0.75rem 1rem;
        border-radius: 10px;
        border: 0;
        background: #2563eb;
        color: white;
        font: inherit;
        cursor: pointer;
      }
      .primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .ghost {
        width: 100%;
        margin-top: 0.5rem;
        padding: 0.65rem 1rem;
        border-radius: 10px;
        border: 1px solid #d1d5db;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
        text-align: center;
        display: block;
        text-decoration: none;
      }
      .err {
        color: #b91c1c;
        margin-top: 0.5rem;
      }
      .ok {
        color: #047857;
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <main class="card" aria-live="polite">
      <div id="loading">Laster invitasjon …</div>
      <div id="preview" hidden>
        <h1 id="previewTitle"></h1>
        <p class="meta" id="previewMeta"></p>
        <div id="previewActions"></div>
      </div>
      <div id="errorBox" hidden>
        <h1>Kunne ikke åpne invitasjonen</h1>
        <p class="err" id="errorMessage"></p>
        <a href="/login.html" class="ghost">Tilbake til innlogging</a>
      </div>
    </main>

    <script>
      (function () {
        function getToken() {
          // Support both /invite.html?token=xxx and /invite/:token legacy path.
          const url = new URL(window.location.href);
          const q = url.searchParams.get('token');
          if (q) return q;
          const match = /\/invite\/([^/?#]+)/.exec(url.pathname);
          return match ? decodeURIComponent(match[1]) : null;
        }

        function showError(msg) {
          document.getElementById('loading').hidden = true;
          document.getElementById('preview').hidden = true;
          document.getElementById('errorBox').hidden = false;
          document.getElementById('errorMessage').textContent = msg;
        }

        function showPreview(peek, authenticated) {
          document.getElementById('loading').hidden = true;
          document.getElementById('preview').hidden = false;
          document.getElementById('previewTitle').textContent = 'Bli med i ' + peek.familyName;
          const meta = [
            'Rolle: ' + (peek.assignedRole === 'child' ? 'barn' : 'voksen'),
            peek.inviterName ? 'Invitert av ' + peek.inviterName : null,
          ]
            .filter(Boolean)
            .join(' · ');
          document.getElementById('previewMeta').textContent = meta;
          const actions = document.getElementById('previewActions');
          actions.innerHTML = '';
          if (authenticated) {
            const btn = document.createElement('button');
            btn.className = 'primary';
            btn.textContent = 'Bekreft — bli med i familien';
            btn.addEventListener('click', async function () {
              btn.disabled = true;
              const token = getToken();
              try {
                const res = await fetch('/api/invitations/' + encodeURIComponent(token) + '/accept', {
                  method: 'POST',
                  credentials: 'include',
                });
                const data = await res.json().catch(function () {
                  return {};
                });
                if (res.ok) {
                  window.location.replace('/');
                } else if (res.status === 409) {
                  showError(data.detail || 'Invitasjonen er allerede brukt.');
                } else if (res.status === 403) {
                  showError(data.detail || 'Invitasjonen kan ikke brukes.');
                } else {
                  showError(data.detail || 'Kunne ikke akseptere invitasjonen.');
                }
              } catch (err) {
                showError('Nettverksfeil. Prøv igjen.');
              }
            });
            actions.appendChild(btn);
          } else {
            const login = document.createElement('a');
            login.className = 'primary';
            login.style.textAlign = 'center';
            login.style.textDecoration = 'none';
            login.style.display = 'block';
            login.href = '/login.html';
            login.textContent = 'Logg inn for å bli med';
            actions.appendChild(login);
            const hint = document.createElement('p');
            hint.className = 'meta';
            hint.style.marginTop = '0.75rem';
            hint.textContent =
              'Etter innlogging: kom tilbake til denne URL-en for å bekrefte.';
            actions.appendChild(hint);
          }
        }

        (async function init() {
          const token = getToken();
          if (!token) {
            showError('Mangler token i URL-en. Kontakt personen som delte lenken.');
            return;
          }
          let peek;
          try {
            const peekRes = await fetch('/api/invitations/' + encodeURIComponent(token), {
              credentials: 'include',
            });
            const data = await peekRes.json().catch(function () {
              return {};
            });
            if (!peekRes.ok) {
              showError(data.detail || 'Invitasjonen finnes ikke eller er utløpt.');
              return;
            }
            peek = data;
          } catch (err) {
            showError('Nettverksfeil. Prøv igjen.');
            return;
          }
          let authenticated = false;
          try {
            const meRes = await fetch('/api/auth/me', { credentials: 'include' });
            const me = await meRes.json().catch(function () {
              return {};
            });
            authenticated = !!(me && me.authenticated && me.user && !me.user.synthetic);
          } catch (err) {
            /* treat as anonymous */
          }
          showPreview(peek, authenticated);
        })();
      })();
    </script>
  </body>
</html>
