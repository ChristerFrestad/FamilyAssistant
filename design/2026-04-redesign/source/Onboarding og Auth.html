<!DOCTYPE html>
<html lang="no" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Familieassistenten — Onboarding & Auth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  :root {
    /* Dark (default) */
    --bg-0: oklch(0.16 0.015 95);
    --bg-1: oklch(0.20 0.018 95);
    --bg-2: oklch(0.24 0.02 95);
    --surface: oklch(0.24 0.018 95 / 0.55);
    --surface-strong: oklch(0.28 0.02 95 / 0.72);
    --stroke: oklch(1 0 0 / 0.08);
    --stroke-strong: oklch(1 0 0 / 0.14);
    --text-1: oklch(0.97 0.01 85);
    --text-2: oklch(0.78 0.015 85);
    --text-3: oklch(0.58 0.015 85);
    --mint: oklch(0.82 0.15 155);
    --mint-deep: oklch(0.55 0.14 155);
    --cyan: oklch(0.82 0.12 215);
    --cyan-deep: oklch(0.55 0.11 215);
    --amber: oklch(0.82 0.13 75);
    --coral: oklch(0.78 0.14 25);
    --rose: oklch(0.72 0.16 0);
    --ink: oklch(0.97 0.01 85);
    --ink-contrast: oklch(0.15 0.02 95);
  }
  html[data-theme="light"] {
    --bg-0: oklch(0.97 0.008 85);
    --bg-1: oklch(0.99 0.005 85);
    --bg-2: oklch(0.94 0.01 85);
    --surface: oklch(1 0 0 / 0.72);
    --surface-strong: oklch(1 0 0 / 0.88);
    --stroke: oklch(0 0 0 / 0.06);
    --stroke-strong: oklch(0 0 0 / 0.12);
    --text-1: oklch(0.22 0.02 85);
    --text-2: oklch(0.42 0.02 85);
    --text-3: oklch(0.58 0.015 85);
    --mint: oklch(0.58 0.14 155);
    --mint-deep: oklch(0.45 0.13 155);
    --cyan: oklch(0.60 0.11 215);
    --cyan-deep: oklch(0.48 0.10 215);
    --amber: oklch(0.68 0.14 75);
    --coral: oklch(0.62 0.16 25);
    --rose: oklch(0.58 0.17 0);
    --ink: oklch(0.22 0.02 85);
    --ink-contrast: oklch(0.99 0.005 85);
  }

  html, body { background: var(--bg-0); color: var(--text-1); }
  body {
    font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "ss01","cv11";
  }
  .font-display { font-family: 'Instrument Serif', ui-serif, Georgia, serif; font-weight: 400; letter-spacing: -0.01em; }
  .font-mono { font-family: 'Geist Mono', ui-monospace, monospace; }

  .aurora { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .aurora::before, .aurora::after {
    content: ""; position: absolute; border-radius: 50%;
    filter: blur(80px); opacity: 0.55;
  }
  .aurora::before {
    width: 560px; height: 560px;
    background: radial-gradient(circle, var(--mint) 0%, transparent 60%);
    top: -120px; inset-inline-start: -100px;
  }
  .aurora::after {
    width: 620px; height: 620px;
    background: radial-gradient(circle, var(--cyan) 0%, transparent 60%);
    bottom: -160px; inset-inline-end: -120px;
    opacity: 0.40;
  }
  html[data-theme="light"] .aurora::before { opacity: 0.28; }
  html[data-theme="light"] .aurora::after { opacity: 0.22; }

  .glass {
    background: var(--surface);
    border: 1px solid var(--stroke);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
  }
  .glass-strong {
    background: var(--surface-strong);
    border: 1px solid var(--stroke-strong);
    backdrop-filter: blur(32px) saturate(160%);
    -webkit-backdrop-filter: blur(32px) saturate(160%);
  }
  .glass-hl { position: relative; }
  .glass-hl::before {
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background: linear-gradient(180deg, oklch(1 0 0 / 0.06), transparent 40%);
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--stroke-strong); border-radius: 4px; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }

  .lift { transition: transform .25s ease, box-shadow .25s ease; }
  .lift:hover { transform: translateY(-2px); }

  .device-frame {
    border-radius: 44px;
    padding: 10px;
    background: linear-gradient(180deg, oklch(0.28 0.02 95), oklch(0.12 0.01 95));
    box-shadow: 0 40px 80px -20px oklch(0 0 0 / 0.6), 0 0 0 1px oklch(1 0 0 / 0.06), inset 0 0 0 1px oklch(1 0 0 / 0.04);
  }
  html[data-theme="light"] .device-frame {
    background: linear-gradient(180deg, oklch(0.82 0.01 85), oklch(0.62 0.01 85));
    box-shadow: 0 40px 80px -20px oklch(0 0 0 / 0.25), 0 0 0 1px oklch(0 0 0 / 0.06);
  }

  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--mint); outline-offset: 2px;
  }

  /* Pulse for magic-link */
  @keyframes softPulse {
    0%,100% { transform: scale(1); box-shadow: 0 0 0 0 oklch(0.82 0.15 155 / 0.4); }
    50% { transform: scale(1.04); box-shadow: 0 0 0 20px oklch(0.82 0.15 155 / 0); }
  }
  .soft-pulse { animation: softPulse 2.6s ease-out infinite; }

  /* Slide in */
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .slide-up { animation: slideUp .35s ease-out both; }

  /* Shake for errors */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-3px); }
    40%, 80% { transform: translateX(3px); }
  }
  .shake { animation: shake .35s ease-in-out; }

  /* Input base */
  .field {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--stroke);
    color: var(--text-1);
    padding: 12px 14px;
    border-radius: 14px;
    font-size: 14px;
    transition: border-color .2s ease, background .2s ease;
  }
  .field:hover { border-color: var(--stroke-strong); }
  .field:focus { border-color: var(--mint); outline: none; background: var(--surface-strong); }
  .field::placeholder { color: var(--text-3); }

  /* Primary button */
  .btn-primary {
    background: var(--ink);
    color: var(--ink-contrast);
    padding: 12px 18px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 500;
    transition: transform .15s ease, box-shadow .2s ease;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px -8px oklch(0 0 0 / 0.3); }
  .btn-primary:disabled { opacity: 0.45; transform: none; box-shadow: none; cursor: not-allowed; }

  .btn-ghost {
    background: transparent;
    color: var(--text-2);
    padding: 12px 18px;
    border-radius: 14px;
    font-size: 14px;
    border: 1px solid var(--stroke);
    transition: background .2s ease, color .2s ease;
  }
  .btn-ghost:hover { background: var(--surface); color: var(--text-1); }

  /* Progress dots */
  .pdot { width: 6px; height: 6px; border-radius: 50%; background: var(--stroke-strong); transition: all .25s ease; }
  .pdot.active { width: 22px; background: var(--mint); border-radius: 3px; }
  .pdot.done { background: var(--mint-deep); }

  /* Terminal-ish code block */
  .term {
    background: oklch(0.14 0.015 95);
    color: oklch(0.82 0.15 155);
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 12px;
    border: 1px solid oklch(1 0 0 / 0.08);
    border-radius: 10px;
    padding: 10px 12px;
    overflow-x: auto;
  }
  html[data-theme="light"] .term { background: oklch(0.22 0.02 85); color: oklch(0.82 0.15 155); }

  /* Screen strip */
  .strip { backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); }
  .strip-btn {
    padding: 6px 12px; border-radius: 999px; font-size: 12px; color: var(--text-2);
    border: 1px solid var(--stroke); background: transparent; white-space: nowrap;
    transition: all .2s ease;
  }
  .strip-btn:hover { color: var(--text-1); border-color: var(--stroke-strong); }
  .strip-btn.active { background: var(--ink); color: var(--ink-contrast); border-color: transparent; font-weight: 500; }
  .strip-btn .num { font-family: 'Geist Mono'; font-size: 10px; opacity: 0.6; margin-inline-end: 4px; }

  /* Network error animated wave */
  @keyframes wobble {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  .wobble { animation: wobble 2.4s ease-in-out infinite; }
</style>
</head>
<body class="min-h-screen">
  <div class="aurora"></div>
  <div id="root" class="relative z-10"></div>

  sparkle: (p={}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2 2-5zM19 14l1 2 2 1-2 1-1 2-1-2-2-1 2-1 1-2zM5 15l.8 1.6 1.6.8-1.6.8L5 19.8 4.2 18.2 2.6 17.4l1.6-.8L5 15z"/></svg>,

const Logo = ({ size = 32 }) => (
  <div className="inline-flex items-center gap-2">
    <I.logo width={size} height={size}/>
    <span className="font-display text-[22px]" style={{letterSpacing:'-0.02em'}}>Familieassistenten</span>
  </div>
);

/* ======================================================
   SHARED: UI atoms
   ====================================================== */
function Toggle({ on, onChange }) {
  return (
    <button onClick={()=>onChange(!on)}
            className="inline-flex items-center"
            style={{
              width: 42, height: 24, borderRadius: 999,
              background: on ? 'var(--mint)' : 'var(--stroke-strong)',
              border: '1px solid var(--stroke)',
              padding: 2, transition: 'background .2s ease',
            }}>
      <div style={{
        width: 18, height: 18, borderRadius: '50%',
        background: on ? 'oklch(0.15 0.02 95)' : 'var(--text-2)',
        transform: `translateX(${on ? 18 : 0}px)`,
        transition: 'transform .2s ease',
      }}/>
    </button>
  );
}

function ThemeToggle() {
  const [theme, setTheme] = useState(
    document.documentElement.getAttribute('data-theme') || 'dark'
  );
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
  }, [theme]);
  return (
    <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
            className="inline-flex items-center justify-center w-9 h-9 rounded-full"
            style={{background:'var(--surface)', border:'1px solid var(--stroke)', color:'var(--text-2)'}}
            title={theme === 'dark' ? 'Bytt til lys' : 'Bytt til mørk'}>
      {theme === 'dark' ? <I.sun width="16" height="16"/> : <I.moon width="16" height="16"/>}
    </button>
  );
}

function ProgressDots({ total, active }) {
  return (
    <div className="inline-flex items-center gap-1.5">
      {Array.from({length: total}).map((_, i) => (
        <div key={i} className={"pdot "+(i === active ? 'active' : i < active ? 'done' : '')}/>
      ))}
    </div>
  );
}

function Field({ label, hint, children, required=false, error }) {
  return (
    <label className="block">

<script type="text/babel" data-presets="react">

/* ======================================================
   SCREEN 05 — Bootstrap Wizard (self-host)
   ====================================================== */
function ScreenBootstrap({ goto, formData, setFormData }) {
  const [step, setStep] = useState(0);
  // Step 2: session secret
  const [secret, setSecret] = useState(() => genSecret());
  const [secretMode, setSecretMode] = useState('auto'); // auto | custom
  const [customSecret, setCustomSecret] = useState('');
  const [copied, setCopied] = useState(false);
  // Step 3: provider
  const [provider, setProvider] = useState('console');
  // Step 4: provider config
  const [resendKey, setResendKey] = useState('');
  const [googleClientId, setGoogleClientId] = useState('');
  const [googleSecret, setGoogleSecret] = useState('');
  const [showGoogleSecret, setShowGoogleSecret] = useState(false);

  function genSecret() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
    let s = '';
    for (let i = 0; i < 48; i++) s += chars[Math.floor(Math.random()*chars.length)];
    return s;
  }

  const copy = async () => {
    try {
      await navigator.clipboard.writeText(secretMode==='auto' ? secret : customSecret);
      setCopied(true);
      setTimeout(()=>setCopied(false), 1400);
    } catch {}
  };

  const steps = ['Velkommen','Secret','Provider','Konfig','Admin'];
  const providerOk = provider === 'console'
    || (provider === 'email' && resendKey.length >= 10)
    || (provider === 'google' && googleClientId && googleSecret);
  const secretOk = secretMode === 'auto' ? !!secret : customSecret.length >= 16;

  const next = () => {
    if (step === 4) {
      // Feed into signup flow with self-host marker
      setFormData({ ...formData, selfHost: true, authProvider: provider });
      goto('signup-1');
    } else {
      setStep(step + 1);
    }
  };

  const back = () => {
    if (step === 0) goto('welcome');
    else setStep(step - 1);
  };

  return (
    <PageShell maxW="max-w-[480px]">
      <div className="flex items-center justify-between">
        <button onClick={back}
                className="w-9 h-9 rounded-full inline-flex items-center justify-center"
                style={{background:'var(--surface)', border:'1px solid var(--stroke)', color:'var(--text-2)'}}>
          <I.arrowBack width="15" height="15"/>
        </button>
        <div className="flex items-center gap-2">
          <div className="text-[10.5px] uppercase tracking-[0.18em]" style={{color:'var(--text-3)'}}>
            Trinn {step + 1} av {steps.length}
          </div>
          <ProgressDots total={steps.length} active={step}/>
        </div>
        <ThemeToggle/>
      </div>

      <div className="flex-1 py-8 slide-up" key={step}>
        {/* STEP 0 — Welcome */}
        {step === 0 && (
          <div>
            <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-[11.5px] mb-4"
                 style={{background:'color-mix(in oklch, var(--amber) 14%, transparent)', color:'var(--amber)',
                         border:'1px solid color-mix(in oklch, var(--amber) 30%, transparent)'}}>
              <I.server width="12" height="12"/> Self-host · første oppstart
            </div>
            <h1 className="font-display text-[32px]" style={{color:'var(--text-1)'}}>
              Du eier dine data.
            </h1>
            <p className="text-[14px] mt-2 leading-relaxed" style={{color:'var(--text-2)'}}>
              Familieassistenten kjører på din egen server eller NAS. Vi veileder deg gjennom
              oppsettet — det tar omtrent tre minutter.
            </p>

            <div className="space-y-2 mt-8">
              {[
                { icon: I.key, label:'SESSION_SECRET', subtitle:'Hemmelig nøkkel for innlogging-tokens' },

                          {p.badge}

                      </div>
                      <div className="text-[12px] mt-1 leading-relaxed" style={{color:'var(--text-3)'}}>{p.subtitle}</div>
                    </div>
                    {active && <I.check width="14" height="14" style={{color:'var(--mint)', marginTop:4}}/>}
                  </button>
                );
              })}
            </div>
          </div>
        )}

        {/* STEP 3 — Configure provider */}
        {step === 3 && (
          <div>

                ? 'Hent en API-nøkkel fra resend.com → API Keys og lim den inn her.'
                : 'Opprett en OAuth 2.0-klient i Google Cloud Console og lim inn Client ID + Secret.'}
            </p>

            {provider === 'console' && (
              <div className="mt-6">
                <div className="term">
                  <span style={{color:'var(--text-3)'}}># docker logs familieassistenten -f</span><br/>
                  [2026-04-23 17:04:21] <span style={{color:'var(--cyan)'}}>INFO</span> Magic link for you@home.lan:<br/>
                  &nbsp;&nbsp;https://family.local/auth/magic?t=a7f...
                </div>
                <div className="mt-4 glass rounded-xl p-3 flex gap-2.5"
                     style={{background:'color-mix(in oklch, var(--amber) 6%, transparent)',
                             border:'1px solid color-mix(in oklch, var(--amber) 20%, transparent)'}}>
                  <I.alert width="14" height="14" style={{color:'var(--amber)', flexShrink:0, marginTop:2}}/>
                  <div className="text-[11.5px]" style={{color:'var(--text-2)'}}>

            )}

            {provider === 'email' && (
              <div className="space-y-4 mt-6">
                <Field label="Resend API-nøkkel" required

                  <input value={resendKey} onChange={e=>setResendKey(e.target.value)}

                <Field label="Avsender e-post" hint="Må være verifisert i Resend">
                  <input placeholder="noreply@familie.lan" className="field"/>

              </div>
            )}

            {provider === 'google' && (
              <div className="space-y-4 mt-6">
                <Field label="Client ID" required>
                  <input value={googleClientId} onChange={e=>setGoogleClientId(e.target.value)}
                         placeholder="xxxxxxxxxxxx.apps.googleusercontent.com"
                         className="field font-mono text-[12.5px]"/>
                </Field>
                <Field label="Client Secret" required>
                  <div className="relative">
                    <input value={googleSecret} onChange={e=>setGoogleSecret(e.target.value)}
                           type={showGoogleSecret?'text':'password'}
                           placeholder="GOCSPX-••••••••••••••••"
                           className="field font-mono text-[12.5px] pe-10"/>
                    <button type="button" onClick={()=>setShowGoogleSecret(!showGoogleSecret)}
                            className="absolute top-1/2 -translate-y-1/2 end-3" style={{color:'var(--text-3)'}}>
                      {showGoogleSecret ? <I.eyeOff width="15" height="15"/> : <I.eye width="15" height="15"/>}
                    </button>
                  </div>
                </Field>
                <Field label="Redirect URI" hint="Legg til i Google Cloud Console">
                  <div className="term text-[12px] break-all">
                    https://family.local/auth/callback/google
                  </div>
                </Field>
              </div>
            )}
          </div>
        )}

        {/* STEP 4 — Admin */}
        {step === 4 && (
          <div>
            <div className="text-[11.5px] uppercase tracking-[0.18em]" style={{color:'var(--text-3)'}}>Steg 4 · Admin</div>
            <h1 className="font-display text-[30px] mt-1" style={{color:'var(--text-1)'}}>Alt er klart.</h1>
            <p className="text-[13.5px] mt-2 leading-relaxed" style={{color:'var(--text-2)'}}>
              Nå oppretter du første bruker — du blir admin.
              Derfra kan du invitere resten av familien.
            </p>

            <div className="glass glass-hl rounded-2xl p-4 mt-6">
              <div className="text-[10.5px] uppercase tracking-[0.18em] mb-2" style={{color:'var(--text-3)'}}>Oppsummering</div>
              <div className="space-y-2 text-[13px]">
                <Row icon={I.key} label="SESSION_SECRET" value="48 tegn · generert" color="var(--mint)"/>
                <Row icon={I.shield} label="Auth-provider"
                     value={provider === 'console' ? 'Console magic-link' : provider === 'email' ? 'Resend e-post' : 'Google OAuth'}
                     color="var(--cyan)"/>
                <Row icon={I.server} label="Status" value="Klar for første bruker" color="var(--amber)"/>
              </div>
            </div>

            <div className="mt-6 text-[11.5px] leading-relaxed" style={{color:'var(--text-3)'}}>
              Etter dette vil nye invitasjoner og innstillinger administreres inne i appen.
              Du kan redigere auth-provider i <span style={{color:'var(--text-2)'}}>Innstillinger → Tilkoblinger</span> senere.
            </div>
          </div>
        )}
      </div>

      <div className="flex items-center gap-2 pt-4">
        <button onClick={back} className="btn-ghost flex-1">
          {step === 0 ? 'Avbryt' : 'Tilbake'}
        </button>
        <button onClick={next}
                disabled={(step===1 && !secretOk) || (step===3 && !providerOk)}
                className="btn-primary flex-[1.5] inline-flex items-center justify-center gap-2">
          {step === 4 ? 'Opprett admin' : 'Fortsett'} <I.arrow width="14" height="14"/>
        </button>
      </div>
    </PageShell>
  );
}

function Row({ icon: Icon, label, value, color }) {
  return (
    <div className="flex items-center gap-3">
      <div className="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0"
           style={{background:`color-mix(in oklch, ${color} 14%, transparent)`, color}}>
        <Icon width="13" height="13"/>
      </div>
      <div className="flex-1 min-w-0 flex items-center justify-between gap-2">
        <span style={{color:'var(--text-2)'}}>{label}</span>
        <span className="font-mono text-[12px] truncate" style={{color:'var(--text-1)'}}>{value}</span>
      </div>
    </div>
  );
}

window.ScreenBootstrap = ScreenBootstrap;
</script>

<script type="text/babel" data-presets="react">

/* ======================================================
   SCREEN 06 — Magic-link sendt
   ====================================================== */
function ScreenMagicSent({ goto, linkPayload }) {
  const email = linkPayload?.email;
  const kind = linkPayload?.kind || 'email';
  const isConsole = kind === 'console' || email === 'console';
  const [resent, setResent] = useState(false);
  const [seconds, setSeconds] = useState(30);

  useEffect(() => {
    if (seconds > 0) {
      const t = setTimeout(()=>setSeconds(s=>s-1), 1000);
      return () => clearTimeout(t);
    }
  }, [seconds]);

  const resend = () => {
    if (seconds > 0) return;
    setResent(true);
    setSeconds(30);
    setTimeout(()=>setResent(false), 1600);
  };

  return (
    <PageShell>
      <div className="flex items-center justify-between">
        <button onClick={()=>goto('login')}
                className="w-9 h-9 rounded-full inline-flex items-center justify-center"
                style={{background:'var(--surface)', border:'1px solid var(--stroke)', color:'var(--text-2)'}}>
          <I.arrowBack width="15" height="15"/>
        </button>
        <ThemeToggle/>
      </div>

      <div className="flex-1 flex flex-col items-center justify-center text-center py-10 slide-up">
        {/* Big icon */}
        <div className="relative">
          <div className="w-24 h-24 rounded-full flex items-center justify-center soft-pulse"
               style={{
                 background:'linear-gradient(135deg, color-mix(in oklch, var(--mint) 24%, transparent), color-mix(in oklch, var(--cyan) 24%, transparent))',
                 color:'var(--mint)',
               }}>
            {isConsole ? <I.term width="42" height="42"/> : <I.mail width="42" height="42"/>}
          </div>
          <div className="absolute -top-1 -end-1 w-8 h-8 rounded-full flex items-center justify-center"
               style={{background:'var(--mint)', color:'var(--ink-contrast)'}}>
            <I.check width="16" height="16"/>
          </div>
        </div>

        <h1 className="font-display text-[38px] mt-8 leading-tight" style={{color:'var(--text-1)'}}>
          {isConsole ? 'Sjekk server-loggen' : 'Sjekk e-posten din'}
        </h1>
        <p className="text-[14px] mt-3 leading-relaxed max-w-[360px]" style={{color:'var(--text-2)'}}>
          {isConsole ? (
            <>Magic-linken er printet til server-loggen. Hent den derfra og åpne lenken i denne fanen for å logge inn.</>
          ) : (
            <>Vi sendte en innloggings-lenke til{' '}
              <span className="font-mono" style={{color:'var(--text-1)'}}>{email || 'din e-post'}</span>.
              Klikk lenken i mailen for å logge inn.</>
          )}
        </p>

        {isConsole && (
          <div className="term mt-6 text-start w-full max-w-[380px]">
            <span style={{color:'var(--text-3)'}}># docker logs familieassistenten</span><br/>
            [{new Date().toLocaleTimeString()}] <span style={{color:'var(--cyan)'}}>INFO</span> Magic link for you:<br/>
            &nbsp;&nbsp;https://family.local/auth/magic?t=<span style={{color:'var(--mint)'}}>eyJhbGciOi...</span>
          </div>
        )}

        {/* Hint card */}
        {!isConsole && (
          <div className="glass glass-hl rounded-2xl p-3 mt-8 w-full max-w-[360px] flex items-start gap-2.5 text-start">
            <I.sparkle width="14" height="14" style={{color:'var(--mint)', flexShrink:0, marginTop:3}}/>
            <div className="text-[12px] leading-relaxed" style={{color:'var(--text-2)'}}>
              Lenken er gyldig i <strong style={{color:'var(--text-1)'}}>10 minutter</strong>.
              Har den gått ut? Be om en ny.
            </div>
          </div>
        )}
      </div>

      <div className="space-y-2">
        <button onClick={resend} disabled={seconds > 0}
                className="w-full inline-flex items-center justify-center gap-2 py-3 rounded-xl text-[13.5px]"
                style={{
                  color: seconds > 0 ? 'var(--text-3)' : 'var(--text-1)',
                  background:'var(--surface)',
                  border:'1px solid var(--stroke)',
                }}>
          {resent ? <><I.check width="14" height="14" style={{color:'var(--mint)'}}/> Sendt på nytt</> :
           seconds > 0 ? <>Send på nytt om <span className="font-mono">{seconds}s</span></> :
           <><I.refresh width="14" height="14"/> Send lenke på nytt</>}
        </button>

        <div className="text-center text-[11.5px] pt-2" style={{color:'var(--text-3)'}}>
          {isConsole ? (
            <>Kjører på Portainer? <a href="#" onClick={(e)=>e.preventDefault()}
                style={{color:'var(--mint)'}}>Se guide →</a></>
          ) : (
            <>Fikk du ikke mailen? Sjekk spam-mappen eller prøv en annen e-post.</>
          )}
        </div>
      </div>
    </PageShell>
  );
}

window.ScreenMagicSent = ScreenMagicSent;
</script>

<script type="text/babel" data-presets="react">

/* ======================================================
   SCREEN 07 — Feilskjerm (3 varianter)
   ====================================================== */
function ScreenError({ goto, variant = 'offline' }) {
  const [localVariant, setLocalVariant] = useState(variant);
  const [retrying, setRetrying] = useState(false);

  const variants = {
    offline: {
      icon: I.wifi,
      color: 'var(--amber)',
      badge: 'Ingen tilkobling',
      code: 'ERR_NET',
      title: 'Ingen nettforbindelse',
      message: 'Sjekk at enheten er koblet til internett. Vi prøver automatisk igjen når du er tilbake online.',
      canRetry: true,
    },
    server: {
      icon: I.server,
      color: 'var(--coral)',
      badge: 'Server-feil',
      code: '503',
      title: 'Serveren svarer ikke',
      message: 'Vi får ikke kontakt med Familieassistenten-serveren. Dette er sjeldent — prøv igjen om litt.',
      canRetry: true,
    },
    unknown: {
      icon: I.alert,
      color: 'var(--rose)',
      badge: 'Uventet feil',
      code: '500',
      title: 'Noe gikk skeivt',
      message: 'Vi støtte på et problem vi ikke ventet. Feilen er logget, og vi ser på det.',
      canRetry: true,
    },
  };

  const v = variants[localVariant];
  const Icon = v.icon;

  const retry = () => {
    setRetrying(true);
    setTimeout(()=> {
      setRetrying(false);
      goto('today');
    }, 800);
  };

  return (
    <PageShell>
      <div className="flex items-center justify-between">
        <button onClick={()=>goto('welcome')}
                className="w-9 h-9 rounded-full inline-flex items-center justify-center"
                style={{background:'var(--surface)', border:'1px solid var(--stroke)', color:'var(--text-2)'}}>
          <I.arrowBack width="15" height="15"/>
        </button>
        <ThemeToggle/>
      </div>

      <div className="flex-1 flex flex-col items-center justify-center text-center py-8 slide-up">
        {/* Icon */}
        <div className="relative wobble">
          <div className="w-28 h-28 rounded-[32px] flex items-center justify-center"
               style={{
                 background: `color-mix(in oklch, ${v.color} 14%, transparent)`,
                 border: `1px solid color-mix(in oklch, ${v.color} 30%, transparent)`,
                 color: v.color,
               }}>
            <Icon width="52" height="52"/>
          </div>
          <div className="absolute -bottom-1 end-0 px-2 py-0.5 rounded-full text-[10px] font-mono"
               style={{background:'var(--ink)', color:'var(--ink-contrast)'}}>
            {v.code}
          </div>
        </div>

        <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full text-[11px] mt-6"
             style={{
               background: `color-mix(in oklch, ${v.color} 10%, transparent)`,
               color: v.color,
               border: `1px solid color-mix(in oklch, ${v.color} 25%, transparent)`,
             }}>
          {v.badge}
        </div>

        <h1 className="font-display text-[38px] mt-4 leading-tight" style={{color:'var(--text-1)'}}>
          {v.title}
        </h1>
        <p className="text-[14px] mt-3 leading-relaxed max-w-[340px]" style={{color:'var(--text-2)'}}>
          {v.message}
        </p>

        {/* Debug info (feel of a real app) */}
        {localVariant !== 'offline' && (
          <div className="glass glass-hl rounded-xl p-3 mt-6 w-full max-w-[360px] text-start">
            <div className="text-[10.5px] uppercase tracking-widest mb-1" style={{color:'var(--text-3)'}}>
              Detaljer
            </div>
            <div className="font-mono text-[11.5px]" style={{color:'var(--text-2)'}}>
              {localVariant === 'server'
                ? 'request_id: 7f3a2b · service unavailable'
                : 'trace_id: 9c1e...2f · see server logs'}
            </div>
          </div>
        )}
      </div>

      <div className="space-y-2">
        {v.canRetry && (
          <button onClick={retry} disabled={retrying}
                  className="btn-primary w-full inline-flex items-center justify-center gap-2">
            {retrying
              ? <><div className="animate-spin w-4 h-4 rounded-full border-2" style={{borderColor:'var(--stroke)', borderTopColor:'var(--ink-contrast)'}}/> Prøver igjen</>
              : <><I.refresh width="14" height="14"/> Prøv igjen</>}
          </button>
        )}
        <div className="flex items-center justify-center gap-4 text-[12px] pt-2">
          <a href="#" onClick={(e)=>e.preventDefault()} style={{color:'var(--text-2)'}}>Rapporter problem</a>
          <span style={{color:'var(--stroke-strong)'}}>·</span>
          <a href="#" onClick={(e)=>{e.preventDefault(); goto('welcome');}} style={{color:'var(--text-2)'}}>Til forsiden</a>
        </div>

        {/* Variant switcher — only on this demo */}
        <div className="mt-4 pt-4 border-t" style={{borderColor:'var(--stroke)'}}>
          <div className="text-[10.5px] uppercase tracking-widest mb-2 text-center" style={{color:'var(--text-3)'}}>
            Forhåndsvis variant
          </div>
          <div className="flex gap-1 justify-center flex-wrap">
            {Object.keys(variants).map(k => (
              <button key={k} onClick={()=>setLocalVariant(k)}
                      className="px-3 py-1 rounded-full text-[11px]"
                      style={{
                        background: localVariant === k ? 'var(--ink)' : 'transparent',
                        color: localVariant === k ? 'var(--ink-contrast)' : 'var(--text-2)',
                        border: '1px solid var(--stroke)',
                      }}>
                {k}
              </button>
            ))}
          </div>
        </div>
      </div>
    </PageShell>
  );
}

window.ScreenError = ScreenError;
</script>

<script type="text/babel" data-presets="react">

/* ======================================================
   SHOWCASE SHELL — navigasjons-strip + device frame
   ====================================================== */
const SCREENS = [
  { id:'welcome',   num:'01', label:'Velkomst',        group:'onboarding' },
  { id:'login',     num:'02', label:'Logg inn',        group:'onboarding' },
  { id:'signup-1',  num:'03', label:'Opprett · 1',     group:'onboarding' },
  { id:'signup-2',  num:'04', label:'Opprett · 2',     group:'onboarding' },
  { id:'bootstrap', num:'05', label:'Bootstrap',       group:'onboarding' },
  { id:'magic-sent',num:'06', label:'Magic-link sendt',group:'onboarding' },
  { id:'error',     num:'07', label:'Feilskjerm',      group:'onboarding' },
  { id:'today',     num:'08', label:'I dag',           group:'app', external:true, app:'today' },
  { id:'cal',       num:'09', label:'Kalender',        group:'app', external:true, app:'cal' },
  { id:'meals',     num:'10', label:'Ukesmeny',        group:'app', external:true, app:'meals' },
  { id:'shop',      num:'11', label:'Handletur',       group:'app', external:true, app:'shop' },
  { id:'chores',    num:'12', label:'Gjøremål',        group:'app', external:true, app:'chores' },
  { id:'settings',  num:'13', label:'Innstillinger',   group:'app', external:true, app:'settings' },
];

function App() {
  const savedTheme = localStorage.getItem('fa-theme') || 'dark';
  useEffect(() => { document.documentElement.setAttribute('data-theme', savedTheme); }, []);

  const [screen, setScreen] = useState(() => {
    return localStorage.getItem('fa-onboarding-screen') || 'welcome';
  });
  const [formData, setFormData] = useState({});
  const [linkPayload, setLinkPayload] = useState(null);

  useEffect(() => {
    localStorage.setItem('fa-onboarding-screen', screen);
  }, [screen]);

  // Available providers — in real app, comes from config endpoint.
  // We expose a tweak so designers can preview different installations.
  const [providers, setProviders] = useState(['google', 'email', 'console']);

  const goto = (target, payload) => {
    const def = SCREENS.find(s => s.id === target);
    if (def?.external) {
      // Jump to main app file with hash
      window.location.href = `./Familieassistenten.html#${def.app}`;
      return;
    }
    if (target === 'magic-sent') setLinkPayload(payload || null);
    setScreen(target);
  };

  const current = SCREENS.find(s => s.id === screen) || SCREENS[0];

  return (
    <>
      <ScreenStrip current={screen} onSelect={(id)=>setScreen(id)}
                   providers={providers} setProviders={setProviders}/>

      <div className="pt-[72px] pb-20 px-4 flex items-start justify-center min-h-screen">
        <div className="relative w-full max-w-[420px] slide-up" key={screen}>
          {/* Device frame on desktop */}
          <div className="device-frame hidden sm:block">
            <div className="rounded-[34px] overflow-y-auto no-scrollbar"
                 style={{background:'var(--bg-0)', height: 860}}>
              <ScreenRouter screen={screen} goto={goto}
                            formData={formData} setFormData={setFormData}
                            linkPayload={linkPayload} providers={providers}/>
            </div>
          </div>
          {/* Direct render on mobile */}
          <div className="sm:hidden">
            <ScreenRouter screen={screen} goto={goto}
                          formData={formData} setFormData={setFormData}
                          linkPayload={linkPayload} providers={providers}/>
          </div>

          {/* Screen info */}
          <div className="text-center mt-6 sm:mt-8">
            <div className="inline-flex items-center gap-2 text-[11px] font-mono" style={{color:'var(--text-3)'}}>
              <span style={{color:'var(--mint)'}}>{current.num}</span>
              <span style={{color:'var(--stroke-strong)'}}>·</span>
              <span>{current.label}</span>
            </div>
          </div>
        </div>
      </div>
    </>
  );
}

function ScreenRouter({ screen, goto, formData, setFormData, linkPayload, providers }) {
  switch (screen) {
    case 'welcome':   return <ScreenWelcome goto={goto}/>;
    case 'login':     return <ScreenLogin goto={goto} availableProviders={providers}/>;
    case 'signup-1':  return <ScreenSignup1 goto={goto} formData={formData} setFormData={setFormData}/>;
    case 'signup-2':  return <ScreenSignup2 goto={goto} formData={formData} setFormData={setFormData}/>;
    case 'bootstrap': return <ScreenBootstrap goto={goto} formData={formData} setFormData={setFormData}/>;
    case 'magic-sent':return <ScreenMagicSent goto={goto} linkPayload={linkPayload}/>;
    case 'error':     return <ScreenError goto={goto}/>;
    default:          return <ScreenWelcome goto={goto}/>;
  }
}

function ScreenStrip({ current, onSelect, providers, setProviders }) {
  const [providerMenu, setProviderMenu] = useState(false);
  return (
    <div className="fixed top-0 start-0 end-0 z-40 strip"
         style={{background:'color-mix(in oklch, var(--bg-0) 72%, transparent)',
                 borderBottom:'1px solid var(--stroke)'}}>
      <div className="max-w-[1400px] mx-auto px-4 py-3 flex items-center gap-3">
        <div className="flex items-center gap-2 flex-shrink-0">
          <I.logo width="22" height="22"/>
          <span className="font-display text-[16px] hidden sm:inline" style={{color:'var(--text-1)'}}>
            Onboarding
          </span>
        </div>

        <div className="flex-1 overflow-x-auto no-scrollbar">
          <div className="flex items-center gap-1.5">
            {SCREENS.map((s, idx) => (
              <React.Fragment key={s.id}>
                {idx === 7 && (
                  <div className="w-px h-5 mx-1 flex-shrink-0" style={{background:'var(--stroke-strong)'}}/>
                )}
                <button onClick={()=>onSelect(s.id)}
                        className={`strip-btn ${current===s.id?'active':''} ${s.external?'opacity-80':''}`}
                        title={s.external ? 'Åpner hovedappen' : s.label}>
                  <span className="num">{s.num}</span>
                  <span className="hidden md:inline">{s.label}</span>
                  <span className="md:hidden">{s.label.slice(0,4)}</span>
                  {s.external && <span className="opacity-60 ms-1">↗</span>}
                </button>
              </React.Fragment>
            ))}
          </div>
        </div>

        {/* Provider menu (for Login screen) */}
        <div className="flex-shrink-0 flex items-center gap-2">
          {current === 'login' && (
            <div className="relative">
              <button onClick={()=>setProviderMenu(!providerMenu)}
                      className="strip-btn inline-flex items-center gap-1.5">
                <I.shield width="11" height="11"/>
                <span className="hidden sm:inline">Providers · {providers.length}</span>
              </button>
              {providerMenu && (
                <div className="absolute end-0 top-10 glass-strong rounded-xl p-2 min-w-[220px] z-50">
                  <div className="text-[10px] uppercase tracking-widest px-2 py-1.5" style={{color:'var(--text-3)'}}>
                    Aktive providere (tweak)
                  </div>
                  {['google','email','console'].map(p => (
                    <label key={p} className="flex items-center gap-2 px-2 py-1.5 rounded-lg cursor-pointer hover:bg-[color-mix(in_oklch,var(--text-1)_6%,transparent)]">
                      <input type="checkbox" checked={providers.includes(p)}
                             onChange={() => setProviders(providers.includes(p)
                               ? providers.filter(x=>x!==p)
                               : [...providers, p])}
                             className="accent-[var(--mint)]"/>
                      <span className="text-[13px]" style={{color:'var(--text-1)'}}>{p}</span>
                    </label>
                  ))}
                </div>
              )}
            </div>
          )}
          <ThemeSwitch/>
        </div>
      </div>
    </div>
  );
}

function ThemeSwitch() {
  const [theme, setTheme] = useState(() => localStorage.getItem('fa-theme') || 'dark');
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('fa-theme', theme);
  }, [theme]);
  return (
    <button onClick={()=>setTheme(theme==='dark'?'light':'dark')}
            className="w-9 h-9 rounded-full inline-flex items-center justify-center"
            style={{background:'var(--surface)', border:'1px solid var(--stroke)', color:'var(--text-2)'}}>
      {theme==='dark' ? <I.sun width="15" height="15"/> : <I.moon width="15" height="15"/>}
    </button>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
