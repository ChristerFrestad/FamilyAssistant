<style>
  :root {
    /* Dark (default) */
    --bg-0: oklch(0.16 0.015 95);
    --bg-1: oklch(0.20 0.018 95);
    --bg-2: oklch(0.24 0.02 95);
    --surface: oklch(0.24 0.018 95 / 0.55);
    --surface-strong: oklch(0.28 0.02 95 / 0.72);
    --stroke: oklch(1 0 0 / 0.08);
    --stroke-strong: oklch(1 0 0 / 0.14);
    --text-1: oklch(0.97 0.01 85);
    --text-2: oklch(0.78 0.015 85);
    --text-3: oklch(0.58 0.015 85);
    --mint: oklch(0.82 0.15 155);
    --mint-deep: oklch(0.55 0.14 155);
    --cyan: oklch(0.82 0.12 215);
    --cyan-deep: oklch(0.55 0.11 215);
    --amber: oklch(0.82 0.13 75);
    --coral: oklch(0.78 0.14 25);
    --shadow-glow: 0 0 60px -12px oklch(0.82 0.15 155 / 0.35);
  }
  html[data-theme="light"] {
    --bg-0: oklch(0.97 0.008 85);
    --bg-1: oklch(0.99 0.005 85);
    --bg-2: oklch(0.94 0.01 85);
    --surface: oklch(1 0 0 / 0.72);
    --surface-strong: oklch(1 0 0 / 0.88);
    --stroke: oklch(0 0 0 / 0.06);
    --stroke-strong: oklch(0 0 0 / 0.12);
    --text-1: oklch(0.22 0.02 85);
    --text-2: oklch(0.42 0.02 85);
    --text-3: oklch(0.58 0.015 85);
    --mint: oklch(0.58 0.14 155);
    --mint-deep: oklch(0.45 0.13 155);
    --cyan: oklch(0.60 0.11 215);
    --cyan-deep: oklch(0.48 0.10 215);
    --amber: oklch(0.68 0.14 75);
    --coral: oklch(0.62 0.16 25);
    --shadow-glow: 0 20px 50px -20px oklch(0.55 0.14 155 / 0.25);
  }

  html, body { background: var(--bg-0); color: var(--text-1); }
  body {
    font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "ss01","cv11";
  }
  .font-display { font-family: 'Instrument Serif', ui-serif, Georgia, serif; font-weight: 400; letter-spacing: -0.01em; }
  .font-mono { font-family: 'Geist Mono', ui-monospace, monospace; }

  /* Aurora background */
  .aurora {
    position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0;
  }
  .aurora::before, .aurora::after {
    content: ""; position: absolute; border-radius: 50%;
    filter: blur(80px); opacity: 0.55;
  }
  .aurora::before {
    width: 560px; height: 560px;
    background: radial-gradient(circle, var(--mint) 0%, transparent 60%);
    top: -120px; left: -100px;
  }
  .aurora::after {
    width: 620px; height: 620px;
    background: radial-gradient(circle, var(--cyan) 0%, transparent 60%);
    bottom: -160px; right: -120px;
    opacity: 0.40;
  }
  html[data-theme="light"] .aurora::before { opacity: 0.28; }
  html[data-theme="light"] .aurora::after { opacity: 0.22; }

  /* Glass */
  .glass {
    background: var(--surface);
    border: 1px solid var(--stroke);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
  }
  .glass-strong {
    background: var(--surface-strong);
    border: 1px solid var(--stroke-strong);
    backdrop-filter: blur(32px) saturate(160%);
    -webkit-backdrop-filter: blur(32px) saturate(160%);
  }
  .ring-mint { box-shadow: 0 0 0 1px oklch(0.82 0.15 155 / 0.35), 0 0 40px -10px oklch(0.82 0.15 155 / 0.4); }
  .ring-cyan { box-shadow: 0 0 0 1px oklch(0.82 0.12 215 / 0.35), 0 0 40px -10px oklch(0.82 0.12 215 / 0.4); }

  /* Subtle inner highlight on glass */
  .glass-hl { position: relative; }
  .glass-hl::before {
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background: linear-gradient(180deg, oklch(1 0 0 / 0.06), transparent 40%);
  }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--stroke-strong); border-radius: 4px; }

  /* Striped placeholder */
  .ph-stripes {
    background-image:
      linear-gradient(135deg, var(--stroke) 0 2px, transparent 2px 14px);
    background-color: var(--bg-2);
  }

  /* Checkbox custom */
  .chk {
    width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--stroke-strong);
    display: inline-flex; align-items: center; justify-content: center;
    transition: all .2s ease; flex-shrink: 0;
  }
  .chk.on {
    background: linear-gradient(135deg, var(--mint), var(--mint-deep));
    border-color: transparent;
    box-shadow: 0 0 14px -2px var(--mint);
  }

  /* Progress ring */
  .ring-track { stroke: var(--stroke-strong); }
  .ring-progress { stroke: var(--mint); filter: drop-shadow(0 0 6px oklch(0.82 0.15 155 / 0.5)); }

  /* Pulse */
  @keyframes pulseGlow {
    0%,100% { box-shadow: 0 0 0 0 oklch(0.82 0.15 155 / 0.5); }
    50% { box-shadow: 0 0 0 8px oklch(0.82 0.15 155 / 0); }
  }
  .pulse-glow { animation: pulseGlow 2.4s ease-out infinite; }

  /* Shimmer on bought-state */
  @keyframes lineThrough {
    from { background-size: 0% 1px; }
    to { background-size: 100% 1px; }
  }
  .bought-text {
    background-image: linear-gradient(currentColor, currentColor);
    background-repeat: no-repeat;
    background-position: 0 60%;
    background-size: 100% 1px;
    animation: lineThrough .35s ease forwards;
    opacity: 0.45;
  }

  /* Tab underline animation */
  .tab-dot {
    width: 4px; height: 4px; border-radius: 50%; background: var(--mint);
    box-shadow: 0 0 8px var(--mint);
  }

  /* Streak flame gradient */
  .flame-grad {
    background: linear-gradient(180deg, var(--amber), var(--coral));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* Hover lift */
  .lift { transition: transform .25s ease, box-shadow .25s ease; }
  .lift:hover { transform: translateY(-2px); }

  /* Device frame (mobile preview on desktop) */
  .device-frame {
    border-radius: 44px;
    padding: 10px;
    background: linear-gradient(180deg, oklch(0.28 0.02 95), oklch(0.12 0.01 95));
    box-shadow: 0 40px 80px -20px oklch(0 0 0 / 0.6), 0 0 0 1px oklch(1 0 0 / 0.06), inset 0 0 0 1px oklch(1 0 0 / 0.04);
  }
  html[data-theme="light"] .device-frame {
    background: linear-gradient(180deg, oklch(0.82 0.01 85), oklch(0.62 0.01 85));
    box-shadow: 0 40px 80px -20px oklch(0 0 0 / 0.25), 0 0 0 1px oklch(0 0 0 / 0.06);
  }

  /* Bottom tab blur bar */
  .tabbar { backdrop-filter: blur(28px) saturate(160%); -webkit-backdrop-filter: blur(28px) saturate(160%); }

  /* Tiny hide-scroll */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }

  /* Segmented chip */
  .chip {
    padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 500;
    border: 1px solid var(--stroke); color: var(--text-2); white-space: nowrap;
    transition: all .2s ease; cursor: pointer;
  }
  .chip.active {
    background: oklch(1 0 0 / 0.06); color: var(--text-1);
    border-color: var(--stroke-strong);
  }
  html[data-theme="light"] .chip.active { background: oklch(0 0 0 / 0.05); }

  /* XP bar */
  .xp-fill {
    background: linear-gradient(90deg, var(--mint), var(--cyan));
    box-shadow: 0 0 12px -2px var(--mint);
  }

  /* Shopping category bg */
  .cat-bg { background: linear-gradient(135deg, oklch(1 0 0 / 0.02), oklch(1 0 0 / 0.0)); }
  html[data-theme="light"] .cat-bg { background: linear-gradient(135deg, oklch(0 0 0 / 0.02), transparent); }

  /* Scroll snap meal week */
  .snap-x-mandatory { scroll-snap-type: x mandatory; }
  .snap-start { scroll-snap-align: start; }

  /* Focus ring */
  button:focus-visible, input:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }

  /* Tweaks panel */
  .tweaks {
    position: fixed; right: 16px; bottom: 16px; z-index: 60;
    width: 280px; max-height: 70vh; overflow: auto;
    display: none;
  }
  .tweaks.open { display: block; }
</style>
</head>

/* ------------------ RING ------------------ */
function Ring({ value, size=56, stroke=5, color="mint", label }) {
  const r = (size - stroke)/2;
  const c = 2 * Math.PI * r;
  const off = c * (1 - value/100);
  return (
    <div className="relative inline-flex items-center justify-center" style={{width:size, height:size}}>
      <svg width={size} height={size}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--stroke-strong)" strokeWidth={stroke}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={accentVar(color)} strokeWidth={stroke}
                strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round"
                style={{transform:"rotate(-90deg)", transformOrigin:"center", filter:`drop-shadow(0 0 6px ${accentVar(color)})`}}/>
      </svg>
      <div className="absolute text-center">
        <div className="font-display text-[15px] leading-none" style={{color:"var(--text-1)"}}>{value}%</div>
        {label && <div className="text-[9px] mt-0.5" style={{color:"var(--text-3)"}}>{label}</div>}
      </div>
    </div>
  );
}

/* ------------------ HANDLETUR ------------------ */
function ShoppingList() {
  const [data, setData] = useState(shoppingData);
  const [filter, setFilter] = useState("alle");
  const [menuOpen, setMenuOpen] = useState(null); // "ci-ii"
  const [toast, setToast] = useState(null);
  const [unpreferred, setUnpreferred] = useState([]); // [{name, recipe}]

  const pingToast = (msg) => { setToast(msg); setTimeout(()=>setToast(null), 2500); };

  const toggle = (ci, ii) => {
    setData(d => d.map((c,i) => i!==ci ? c : {...c, items: c.items.map((it,j) => j!==ii ? it : {...it, bought: !it.bought})}));
  };
  const removeItem = (ci, ii) => {
    const item = data[ci].items[ii];
    setData(d => d.map((c,i) => i!==ci ? c : {...c, items: c.items.filter((_,j)=>j!==ii)}));
    setMenuOpen(null);
    pingToast(`Fjernet «${item.name}» fra handlelista`);
  };
  const haveAtHome = (ci, ii) => {
    const item = data[ci].items[ii];
    setData(d => d.map((c,i) => i!==ci ? c : {...c, items: c.items.filter((_,j)=>j!==ii)}));
    setMenuOpen(null);
    pingToast(`✓ La «${item.name}» til i pantry`);
    // send til backend: POST /pantry + DELETE fra handleliste
  };
  const unpreferredFor = (ci, ii) => {
    const item = data[ci].items[ii];
    setData(d => d.map((c,i) => i!==ci ? c : {...c, items: c.items.filter((_,j)=>j!==ii)}));
    setUnpreferred(u => [...u, {name: item.name, recipe: item.recipe || "Kremet laks"}]);
    setMenuOpen(null);
    pingToast(`Skal ikke foreslå «${item.name}» til ${item.recipe || "denne retten"} lenger`);
    // send til backend: POST /preferences/unpreferred {ingredient, recipe}
  };

  const all = data.flatMap(c => c.items);
  const bought = all.filter(x=>x.bought).length;
  const total = all.length;
  const sum = all.filter(x=>!x.bought).reduce((a,b)=>a+b.price, 0);

  return (
    <div className="space-y-5">
      {/* Progress panel */}
      <div className="glass glass-hl rounded-[24px] p-5 relative overflow-hidden">
        <div className="flex items-center gap-5">
          <Ring value={Math.round(bought/total*100)} size={72} stroke={6} color="mint" label="ferdig"/>
          <div className="flex-1">
            <div className="text-[13px]" style={{color:"var(--text-2)"}}>
              <span className="font-mono font-semibold" style={{color:"var(--text-1)"}}>{bought}</span> av <span className="font-mono">{total}</span> plukket
            </div>
            <div className="font-display text-[24px] leading-tight whitespace-nowrap" style={{color:"var(--text-1)"}}>
              ~{sum} kr igjen
            </div>
            <div className="text-[11px]" style={{color:"var(--text-3)"}}>Estimat · priser fra Kassal i dag</div>
          </div>
          <button className="w-11 h-11 rounded-full flex items-center justify-center"
                  style={{background:"var(--mint)", color:"oklch(0.15 0.02 95)", boxShadow:"var(--shadow-glow)"}}>
            <I.plus width="18" height="18"/>
          </button>
        </div>
      </div>

      {/* Search + filters */}
      <div className="space-y-2.5">
        <div className="glass rounded-full flex items-center gap-2 px-4 py-2.5">
          <I.search width="16" height="16" style={{color:"var(--text-3)"}}/>
          <input placeholder="Legg til eller søk vare…" className="bg-transparent flex-1 text-[14px] outline-none" style={{color:"var(--text-1)"}}/>
          <button className="w-7 h-7 rounded-full flex items-center justify-center" style={{background:"oklch(0.82 0.15 155 / 0.15)", color:"var(--mint)"}}>
            <I.mic width="14" height="14"/>
          </button>
        </div>
        <div className="flex gap-1.5 overflow-x-auto no-scrollbar -mx-5 px-5">
          {["alle","frukt & grønt","kjøtt & fisk","meieri","tørrvare","hvis lavt hjemme"].map(f =>
            <button key={f} className={"chip "+(filter===f?"active":"")} onClick={()=>setFilter(f)}>{f}</button>
          )}
        </div>
      </div>

      {/* Categories */}
      <div className="space-y-4">
        {data.map((cat, ci) => (
          <div key={cat.cat} className="glass rounded-2xl overflow-hidden" data-ci={ci}>
            <div className="flex items-center justify-between px-4 py-3 cat-bg"
                 style={{borderBottom:"1px solid var(--stroke)"}}>
              <div className="flex items-center gap-2.5">
                <div className="w-2 h-2 rounded-full" style={{background: accentVar(cat.color), boxShadow:`0 0 8px ${accentVar(cat.color)}`}}></div>
                <div className="text-[13px] font-medium" style={{color:"var(--text-1)"}}>{cat.cat}</div>

                    <button onClick={(e)=>{e.stopPropagation(); setMenuOpen(open ? null : key);}}

/* ------------------ GJØREMÅL ------------------ */
const DAYS_SHORT = ["Man","Tir","Ons","Tor","Fre","Lør","Søn"];
const DAYS_LONG  = ["Mandag","Tirsdag","Onsdag","Torsdag","Fredag","Lørdag","Søndag"];
const DATES      = ["20","21","22","23","24","25","26"];

function RecurBadge({ recur, days }) {
  let label = "Hele uka";
  let color = "cyan";
  if (recur === "weekdays") { label = "Man–fre"; color = "mint"; }
  else if (recur === "custom") {
    label = days.length === 1 ? DAYS_SHORT[days[0]] : days.map(d=>DAYS_SHORT[d].slice(0,2)).join("·");
    color = "amber";
  }
  return (
    <span className="text-[10px] px-1.5 py-0.5 rounded-md font-medium"
          style={{background:`${accentVar(color).replace(")", " / 0.12)")}`, color: accentVar(color),
                  border:`1px solid ${accentVar(color).replace(")", " / 0.22)")}`}}>
      {label}
    </span>
  );
}

function ChoreRow({ c, onToggle, onPostpone, onAssign, onOverride, showPostpone, compact, currentUser }) {
  const [showAssign, setShowAssign] = useState(false);
  const isParent = currentUser.role.includes("Pappa") || currentUser.role.includes("Mamma");
  const isMine = c.assignee === currentUser.name;
  // Rolle-regler: forelder kan tildele og overstyre alt; barn kan bare toggle sine egne.
  const canToggle = isParent || isMine;
  const canReassign = isParent;
  const canPostpone = isParent || isMine;
  // Opphev vises bare når oppgaven er merket gjort av noen andre enn en forelder som allerede har overstyrt
  const doneByChild = c.done && c.doneBy && c.doneBy !== "override";
  const showOverride = isParent && c.done && !isMine;

  return (
    <div className={"glass rounded-2xl p-3 flex items-center gap-3 lift relative "+(c.done ? "opacity-70" : "")}>
      <div onClick={()=> canToggle && onToggle(c.id, currentUser.name)}
           className={"chk "+(canToggle?"cursor-pointer":"cursor-not-allowed opacity-50 ")+(c.done?"on":"")}
           title={canToggle ? "" : "Bare tildelt person eller forelder kan huke av"}>
        {c.done && <I.check width="14" height="14" style={{color:"oklch(0.15 0.02 95)"}}/>}
      </div>
      {!compact && <Avatar letter={c.avatar} color={c.color} size={36}/>}
      <div className="flex-1 min-w-0">
        <div className={"text-[14px] font-medium "+(c.done?"bought-text":"")} style={{color:"var(--text-1)"}}>
          {c.task}
          {c.postponedFrom !== undefined && (
            <span className="ml-1.5 text-[10px] font-normal" style={{color:"var(--amber)"}}>
              ↷ fra {DAYS_SHORT[c.postponedFrom].toLowerCase()}
            </span>
          )}
        </div>
        <div className="text-[11px] mt-0.5 flex items-center gap-1.5 flex-wrap" style={{color:"var(--text-3)"}}>
          <button
            onClick={(e)=>{ e.stopPropagation(); if (canReassign) setShowAssign(!showAssign); }}
            className="inline-flex items-center gap-1 px-1.5 py-0.5 -ml-1.5 rounded-md"
            style={{color: canReassign ? "var(--text-2)":"var(--text-3)",
                    background: canReassign ? "oklch(1 0 0 / 0.03)" : "transparent",
                    border: canReassign ? "1px dashed var(--stroke-strong)" : "none",
                    cursor: canReassign ? "pointer" : "default"}}>
            <Avatar letter={c.avatar} color={c.color} size={14}/>
            <span>{c.assignee}</span>
            {canReassign && <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M6 9l6 6 6-6"/></svg>}
          </button>
          <span>·</span>
          <RecurBadge recur={c.recur} days={c.days}/>
          {c.done && c.doneBy && (
            <>
              <span>·</span>
              <span className="inline-flex items-center gap-1"
                    style={{color: c.doneBy==="override" ? "var(--amber)" : "var(--mint)"}}>
                <I.check width="10" height="10"/>
                {c.doneBy==="override" ? `Overstyrt av ${c.overriddenBy||"forelder"}` : `Merket av ${c.doneBy}`}
              </span>
            </>
          )}
        </div>
        {showAssign && canReassign && (
          <div className="mt-2 flex flex-wrap gap-1.5 p-2 rounded-xl"
               style={{background:"var(--surface)", border:"1px solid var(--stroke)"}}>
            <div className="w-full text-[10px] uppercase tracking-widest mb-0.5" style={{color:"var(--text-3)"}}>
              Tildel til {c.postponedFrom!==undefined && "· hentes tilbake er ok"}
            </div>
            {family.map(m => (
              <button key={m.name}
                      onClick={(e)=>{e.stopPropagation(); onAssign(c.id, m); setShowAssign(false);}}
                      className={"flex items-center gap-1.5 px-2 py-1 rounded-full text-[11.5px] "+(m.name===c.assignee ? "ring-mint":"")}
                      style={{background: m.name===c.assignee ? `${accentVar(m.color).replace(")"," / 0.16)")}` : "transparent",
                              color: m.name===c.assignee ? accentVar(m.color) : "var(--text-1)",
                              border: `1px solid ${accentVar(m.color).replace(")", " / 0.3)")}`}}>
                <Avatar letter={m.avatar} color={m.color} size={16}/>
                {m.name}
              </button>
            ))}
          </div>
        )}
      </div>
      <div className="flex flex-col items-end gap-1">
        <div className="text-[11px] font-mono font-semibold px-2 py-0.5 rounded-md"
             style={{background:`${accentVar(c.color).replace(")", " / 0.12)")}`, color: accentVar(c.color)}}>
          +{c.xp} XP
        </div>
        {showOverride && (
          <button onClick={(e)=>{e.stopPropagation(); onOverride(c.id, currentUser.name);}}
                  className="text-[10px] flex items-center gap-1 px-1.5 py-0.5 rounded-md"
                  style={{color:"var(--amber)", background:"oklch(0.82 0.13 75 / 0.1)", border:"1px solid oklch(0.82 0.13 75 / 0.3)"}}
                  title="Opphev — marker oppgaven som ikke gjort">
            <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>
            opphev
          </button>
        )}
        {showPostpone && !c.done && canPostpone && (
          <button onClick={(e)=>{e.stopPropagation(); onPostpone(c.id);}}
                  className="text-[10px] flex items-center gap-0.5 px-1.5 py-0.5 rounded-md"
                  style={{color:"var(--text-2)", border:"1px solid var(--stroke)"}}
                  title="Utsett til i morgen">
            ↷ utsett
          </button>
        )}
      </div>
    </div>
  );
}

      return {...rest, done: false};

function EventDot({ color, size=8 }) {

}

function PersonPill({ who, compact=false }) {
  const m = familyMembers[who] || familyMembers.Alle;
  if (compact) {
    return <div className="w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-mono"
                style={{background:`${accentVar(m.color).replace(")", " / 0.25)")}`, color: accentVar(m.color), border:`1px solid ${accentVar(m.color).replace(")", " / 0.35)")}`}}>
      {m.shortName}
    </div>;
  }
  return <div className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10px] font-medium"
              style={{background:`${accentVar(m.color).replace(")", " / 0.14)")}`, color:accentVar(m.color), border:`1px solid ${accentVar(m.color).replace(")", " / 0.3)")}`}}>
    <span className="w-1.5 h-1.5 rounded-full" style={{background:accentVar(m.color)}}></span>
    {m.name}
  </div>;
}

/* Full kalender-skjerm */
function Calendar({ initialDay = TODAY_IDX, onOpenLink, onOpenSettings }) {
  const [selected, setSelected] = useState(initialDay);
  const [viewMode, setViewMode] = useState("timeline"); // "timeline" | "week"
  const [newEventOpen, setNewEventOpen] = useState(false);
  const selectedEvents = calendarEvents.filter(e => e.dayIndex === selected);
  const sorted = [...selectedEvents].sort((a,b) => {
    if (a.allDay && !b.allDay) return -1;
    if (!a.allDay && b.allDay) return 1;
    return (a.time || "").localeCompare(b.time || "");
  });

  // People filter
  const [activePeople, setActivePeople] = useState(null); // null = alle

  const peopleFilter = (ev) => !activePeople || activePeople === ev.who || ev.who === "Alle";
  const filteredSorted = sorted.filter(peopleFilter);

  return (
    <div className="px-5 space-y-5">
      {/* Header */}
      <div>
        <div className="text-[11px] uppercase tracking-[0.18em]" style={{color:"var(--text-3)"}}>Uke 17 · 20–26 april</div>
        <div className="flex items-end justify-between mt-1">
          <h1 className="font-display text-[34px] leading-tight" style={{color:"var(--text-1)"}}>Kalender</h1>
          <div className="inline-flex items-center p-0.5 rounded-full glass" style={{border:"1px solid var(--stroke)"}}>
            <button onClick={()=>setViewMode("timeline")}
                    className="rounded-full px-3 py-1.5 text-[11px] flex items-center gap-1.5 transition-all"
                    style={{
                      background: viewMode==="timeline" ? "var(--ink)" : "transparent",
                      color: viewMode==="timeline" ? "var(--ink-contrast)" : "var(--text-2)",
                      fontWeight: viewMode==="timeline" ? 600 : 400,
                    }}>
              <I.clock width="11" height="11"/> Dag
            </button>
            <button onClick={()=>setViewMode("week")}
                    className="rounded-full px-3 py-1.5 text-[11px] flex items-center gap-1.5 transition-all"
                    style={{
                      background: viewMode==="week" ? "var(--ink)" : "transparent",
                      color: viewMode==="week" ? "var(--ink-contrast)" : "var(--text-2)",
                      fontWeight: viewMode==="week" ? 600 : 400,
                    }}>
              <I.calendar width="11" height="11"/> Uke
            </button>
          </div>
        </div>
        <div className="flex items-center gap-2 mt-1 text-[12px]" style={{color:"var(--text-2)"}}>
          <span className="inline-flex items-center gap-1"><I.google width="11" height="11"/> Google</span>
          <span>+</span>
          <span className="inline-flex items-center gap-1"><I.apple width="11" height="11" style={{color:"var(--text-2)"}}/> Apple</span>
          <span style={{color:"var(--text-3)"}}>· synket 2 min siden</span>
        </div>
      </div>

      {/* People filter */}
      <div className="flex gap-2 overflow-x-auto no-scrollbar -mx-5 px-5">
        <button onClick={()=>setActivePeople(null)}
                className={"flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[12px] whitespace-nowrap flex-shrink-0 "+(activePeople===null?"ring-mint":"")}
                style={{background: activePeople===null ? "oklch(0.82 0.15 155 / 0.14)" : "var(--surface)",
                        color: activePeople===null ? "var(--mint)" : "var(--text-2)",
                        border:"1px solid var(--stroke)"}}>
          Alle familien
        </button>
        {Object.values(familyMembers).filter(m=>m.name!=="Alle familien").map(m => (
          <button key={m.name} onClick={()=>setActivePeople(activePeople===m.name ? null : m.name)}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[12px] whitespace-nowrap flex-shrink-0"
                  style={{background: activePeople===m.name ? `${accentVar(m.color).replace(")", " / 0.18)")}` : "var(--surface)",
                          color: activePeople===m.name ? accentVar(m.color) : "var(--text-2)",
                          border: `1px solid ${activePeople===m.name ? accentVar(m.color).replace(")", " / 0.35)") : "var(--stroke)"}`}}>
            <span className="w-1.5 h-1.5 rounded-full" style={{background:accentVar(m.color)}}></span>
            {m.name}
          </button>
        ))}
      </div>

      {/* Day strip */}
      <div className="flex gap-2 overflow-x-auto no-scrollbar -mx-5 px-5">
        {weekDayShort.map((d, i) => {
          const dayEvents = calendarEvents.filter(e => e.dayIndex === i).filter(peopleFilter);
          const isSelected = selected === i;
          const isToday = i === TODAY_IDX;
          // Unique people colors for the dots row
          const peopleColors = [...new Set(dayEvents.map(e => familyMembers[e.who]?.color || "mint"))];
          return (
            <button key={i} onClick={()=>setSelected(i)}
                    className={"flex-shrink-0 rounded-2xl px-3 py-2.5 text-center transition-all lift "+(isSelected?"glass-strong ring-mint":"glass")}
                    style={{minWidth:58}}>
              <div className="text-[10px] uppercase tracking-wider" style={{color: isSelected?"var(--mint)":"var(--text-3)"}}>{d}</div>
              <div className="font-display text-[22px] leading-none mt-0.5 relative inline-block" style={{color:"var(--text-1)"}}>
                {weekDates[i]}
                {isToday && <span className="absolute -top-0.5 -right-2 w-1.5 h-1.5 rounded-full" style={{background:"var(--mint)", boxShadow:"0 0 6px var(--mint)"}}></span>}
              </div>
              <div className="flex justify-center gap-0.5 mt-1.5 min-h-[4px]">
                {peopleColors.slice(0,4).map((c,idx) => (
                  <span key={idx} className="w-1 h-1 rounded-full" style={{background:accentVar(c)}}></span>
                ))}
              </div>
            </button>
          );
        })}
      </div>

      {viewMode === "timeline" ? (
        <>
          {/* Day summary card */}
          <div className="glass rounded-2xl p-4">
            <div className="flex items-center justify-between mb-1">
              <div className="font-display text-[22px] whitespace-nowrap" style={{color:"var(--text-1)"}}>{weekDayNames[selected]} {weekDates[selected]}. april</div>
              <div className="text-[11px] flex-shrink-0 ml-2" style={{color:"var(--text-3)"}}>{filteredSorted.length} hendelser</div>
            </div>
            {/* Timeline */}
            <div className="mt-3 divide-y" style={{borderColor:"var(--stroke)"}}>
              {filteredSorted.length === 0 ? (
                <div className="text-[12px] py-4 text-center" style={{color:"var(--text-3)"}}>Ingen hendelser denne dagen</div>
              ) : filteredSorted.map(ev => (
                <div key={ev.id} className="pt-1 first:pt-0">
                  <EventRow ev={ev} onTap={()=>ev.link && onOpenLink && onOpenLink(ev.link)}/>
                </div>
              ))}
            </div>
            <button onClick={()=>setNewEventOpen(true)}
                    className="w-full mt-3 rounded-xl py-2.5 text-[12.5px] flex items-center justify-center gap-1.5"
                    style={{background:"var(--surface-strong)", color:"var(--text-1)", border:"1px dashed var(--stroke-strong)"}}>
              <I.plus width="13" height="13"/> Legg til hendelse
            </button>
          </div>
        </>
      ) : (
        /* Week listing — én seksjon per dag */
        <div className="space-y-3">
          {weekDayNames.map((dn, i) => {
            const dayEv = calendarEvents.filter(e => e.dayIndex === i).filter(peopleFilter)
              .sort((a,b) => (a.allDay?-1:1) - (b.allDay?-1:1) || (a.time||"").localeCompare(b.time||""));
            if (dayEv.length === 0) return null;
            return (
              <div key={i} className="glass rounded-2xl p-3">
                <div className="flex items-center justify-between mb-1 px-2">
                  <div className="flex items-baseline gap-2">
                    <div className="font-display text-[18px]" style={{color:"var(--text-1)"}}>{dn}</div>
                    <div className="text-[11px] font-mono" style={{color:"var(--text-3)"}}>{weekDates[i]}. april</div>
                    {i === TODAY_IDX && <span className="text-[10px] px-1.5 py-0.5 rounded-full" style={{background:"oklch(0.82 0.15 155 / 0.14)", color:"var(--mint)"}}>i dag</span>}
                  </div>
                  <div className="text-[10px]" style={{color:"var(--text-3)"}}>{dayEv.length}</div>
                </div>
                <div className="divide-y" style={{borderColor:"var(--stroke)"}}>
                  {dayEv.map(ev => <EventRow key={ev.id} ev={ev} onTap={()=>ev.link && onOpenLink && onOpenLink(ev.link)}/>)}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Integration strip */}
      <div className="glass rounded-2xl p-3.5 flex items-center justify-between">
        <div className="flex items-center gap-2.5">
          <div className="w-8 h-8 rounded-lg flex items-center justify-center"
               style={{background:"var(--surface)"}}>
            <I.link width="14" height="14" style={{color:"var(--text-2)"}}/>
          </div>
          <div>
            <div className="text-[12.5px]" style={{color:"var(--text-1)"}}>2 kalendere synket</div>
            <div className="text-[10.5px]" style={{color:"var(--text-3)"}}>Google (Lise, Per) · Apple (Per) · toveis</div>
          </div>
        </div>
        <button onClick={onOpenSettings} className="text-[11px] font-medium" style={{color:"var(--mint)"}}>Håndter →</button>
      </div>

      {newEventOpen && <NewEventModal defaultDay={selected} onClose={()=>setNewEventOpen(false)}/>}
    </div>
  );
}

                        border:`1px solid ${cal==="google" ? "var(--mint)" : "var(--stroke)"}`

              <button onClick={()=>setCal("apple")}
                      className="rounded-xl px-3 py-2.5 flex items-center justify-center gap-1.5 text-[12.5px]"
                      style={{
                        background: cal==="apple" ? "var(--surface-strong)" : "var(--surface)",
                        color:"var(--text-1)",
                        border:`1px solid ${cal==="apple" ? "var(--mint)" : "var(--stroke)"}`
                      }}>
                <I.apple width="13" height="13"/> Apple

            </div>
          </div>

          {/* Notify */}
          <div className="flex items-center justify-between rounded-xl px-3 py-2.5"
               style={{background:"var(--surface)", border:"1px solid var(--stroke)"}}>

              <div className="text-[13px]" style={{color:"var(--text-1)"}}>Påminnelse</div>

          <button onClick={onClose} className="flex-1 rounded-xl py-2.5 text-[13px]"
                  style={{background:"var(--surface)", color:"var(--text-2)", border:"1px solid var(--stroke)"}}>
            Avbryt
          </button>
          <button onClick={onClose} disabled={!title.trim()}
                  className="flex-[1.6] rounded-xl py-2.5 text-[13px] font-medium flex items-center justify-center gap-1.5 disabled:opacity-50"

}

function SettingsGroup({ title, children }) {

function Toggle({ on, onChange }) {
  return (
    <button onClick={(e)=>{e.stopPropagation(); onChange(!on);}}
            className="relative w-[38px] h-[22px] rounded-full transition-colors flex-shrink-0"
            style={{background: on ? "var(--mint)" : "var(--stroke-strong)"}}>
      <span className="absolute top-0.5 w-[18px] h-[18px] rounded-full transition-all"
            style={{left: on ? "18px" : "2px", background:"white", boxShadow:"0 2px 4px oklch(0 0 0 / 0.2)"}}></span>
    </button>
  );
}

            <span className="flex-1 truncate">kslp_●●●●●●●●●●●●●a9f2</span>
            <button className="text-[11px] font-medium" style={{color:"var(--mint)"}}>Endre</button>
          </div>
          <div className="text-[10.5px] mt-2" style={{color:"var(--text-3)"}}>
            Bruker din egen Kassal.app-nøkkel — ingen data sendes via oss. Hent nøkkel på kassal.app/api.
          </div>
        </div>
        <div className="p-3 pt-3">
          <div className="flex items-center justify-between mb-2">
            <div>
              <div className="text-[13px]" style={{color:"var(--text-1)"}}>Foretrukne butikker</div>
              <div className="text-[10.5px]" style={{color:"var(--text-3)"}}>Assistenten prioriterer disse når den henter priser</div>
            </div>
          </div>
          <div className="grid grid-cols-3 gap-1.5">
            {[
              {id:"kiwi",    name:"Kiwi",       color:"mint",  sel:true},
              {id:"rema",    name:"Rema 1000",  color:"coral", sel:true},
              {id:"meny",    name:"Meny",       color:"amber", sel:false},
              {id:"coop",    name:"Coop Xtra",  color:"cyan",  sel:true},
              {id:"spar",    name:"Spar",       color:"mint",  sel:false},
              {id:"bunnpris",name:"Bunnpris",   color:"coral", sel:false},
            ].map(s => (
              <button key={s.id}
                      className="rounded-xl px-2 py-2.5 text-left transition-all"
                      style={{
                        background: s.sel ? `${accentVar(s.color).replace(")", " / 0.14)")}` : "var(--surface)",
                        border: s.sel ? `1px solid ${accentVar(s.color).replace(")", " / 0.5)")}` : "1px solid var(--stroke)",
                        color: s.sel ? accentVar(s.color) : "var(--text-2)"
                      }}>
                <div className="flex items-center justify-between">
                  <span className="text-[12px] font-medium">{s.name}</span>
                  {s.sel && <I.check width="12" height="12"/>}
                </div>
                <div className="text-[9.5px] mt-0.5" style={{color: s.sel ? "currentColor" : "var(--text-3)", opacity: s.sel ? 0.75 : 1}}>
                  {s.sel ? "Aktiv" : "Trykk for å velge"}
                </div>
              </button>
            ))}
          </div>
        </div>
        <SettingsRow
          icon={I.bolt} iconColor="amber"
          title="Henter tilbud automatisk"
          subtitle="Oppdaterer ukentlig · torsdag 06:00"
          right={<Toggle on={true} onChange={()=>{}}/>}/>
        <SettingsRow
          icon={I.cart} iconColor="cyan"
          title="Oda handlelevering"
          subtitle="Tilkoblet · onsdager 17:30"
          right={<Toggle on={true} onChange={()=>{}}/>}/>
      </SettingsGroup>

      {/* AI assistant */}
      <SettingsGroup title="Assistenten">
        <SettingsRow
          icon={I.sparkles} iconColor="mint"
          title="Smarte forslag"
          subtitle="AI foreslår middag, oppgaver, handleliste"
          right={<Toggle on={smartSuggest} onChange={setSmartSuggest}/>}/>
        <SettingsRow
          icon={I.mic} iconColor="cyan"
          title="Stemmeassistent"
          subtitle="Hold mic-knappen eller si «Hei Fam»"
          right={<Toggle on={voiceOn} onChange={setVoiceOn}/>}/>
        <SettingsRow
          icon={I.heart} iconColor="coral"
          title="Diettpreferanser og allergier"
          subtitle="Vegetar (Lise) · Nøtteallergi (Mats)"
          right={<I.chevron width="14" height="14"/>}/>
        <SettingsRow
          icon={I.book} iconColor="amber"
          title="Lær assistenten"
          subtitle="14 tilbakemeldinger · 3 uforetrukne"
          right={<I.chevron width="14" height="14"/>}/>
      </SettingsGroup>

      {/* Family life / gamification */}
      <SettingsGroup title="Familieliv">
        <SettingsRow
          icon={I.trophy} iconColor="amber"
          title="Gamification"
          subtitle={gamification
            ? "XP, streaks, merker og leaderboard for Gjøremål"
            : "Av — gjøremål vises uten poeng og belønninger"}
          right={<Toggle on={gamification} onChange={setGamification}/>}/>
        {gamification && (
          <>
            <SettingsRow
              icon={I.bolt} iconColor="mint"
              title="Vis XP og merker på dashboard"
              subtitle="Dine medlemmer ser poengene sine på forsiden"
              right={<Toggle on={true} onChange={()=>{}}/>}/>
            <SettingsRow
              icon={I.flame} iconColor="coral"
              title="Ukentlig belønning"
              subtitle="Sett mål og belønning i Gjøremål"
              right={<I.chevron width="14" height="14"/>}/>
          </>
        )}
      </SettingsGroup>

      {/* Notifications */}
      <SettingsGroup title="Varsler">
        <SettingsRow
          icon={I.utensils} iconColor="mint"
          title="Påminnelse om middag"
          subtitle="1 time før middagstid"
          right={<Toggle on={notifMeal} onChange={setNotifMeal}/>}/>
        <SettingsRow
          icon={I.broom} iconColor="amber"
          title="Gjøremål"
          subtitle="Om morgenen kl. 08:00"
          right={<Toggle on={notifChore} onChange={setNotifChore}/>}/>
        <SettingsRow
          icon={I.calendar} iconColor="cyan"
          title="Kalenderhendelser"
          subtitle="30 min før avtaler"
          right={<Toggle on={notifCal} onChange={setNotifCal}/>}/>
        <SettingsRow
          icon={I.fridge} iconColor="coral"
          title="Lavt på varer"
          subtitle="Når en vare går mot tomt"
          right={<Toggle on={notifLow} onChange={setNotifLow}/>}/>
      </SettingsGroup>

      {/* Preferences */}
      <SettingsGroup title="Preferanser">
        <SettingsRow
          icon={I.calendar} iconColor="mint"
          title="Uken starter"
          right={<>
            <span className="text-[12.5px]" style={{color:"var(--text-1)"}}>{weekStart==="monday"?"Mandag":"Søndag"}</span>
            <I.chevron width="14" height="14"/>
          </>}
          onClick={()=>setWeekStart(weekStart==="monday"?"sunday":"monday")}/>
        <SettingsRow
          icon={theme==="dark"?I.moon:I.sun} iconColor={theme==="dark"?"cyan":"amber"}
          title="Utseende"
          right={<>
            <span className="text-[12.5px]" style={{color:"var(--text-1)"}}>{theme==="dark"?"Mørk":"Lys"}</span>
            <I.chevron width="14" height="14"/>
          </>}
          onClick={()=>setTheme(theme==="dark"?"light":"dark")}/>
        <SettingsRow
          icon={I.bolt} iconColor="amber"
          title="Valuta og enheter"
          right={<>
            <span className="text-[12.5px]" style={{color:"var(--text-1)"}}>NOK · kg/l</span>
            <I.chevron width="14" height="14"/>
          </>}/>
      </SettingsGroup>

      {/* Account + support */}
      <SettingsGroup title="Konto og personvern">
        <SettingsRow icon={I.settings} iconColor="mint" title="Administrer abonnement"
          subtitle="Familie Plus · fornyes 15. mai" right={<I.chevron width="14" height="14"/>}/>
        <SettingsRow icon={I.search} iconColor="cyan" title="Personvern og data"
          subtitle="Last ned · slett data" right={<I.chevron width="14" height="14"/>}/>
        <SettingsRow icon={I.bell} iconColor="amber" title="Hjelp og tilbakemelding"
          right={<I.chevron width="14" height="14"/>}/>
      </SettingsGroup>

      {/* Danger zone */}
      <SettingsGroup>
        <SettingsRow danger
          icon={({width,height}) => <svg viewBox="0 0 24 24" width={width||15} height={height||15} fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>}
          title="Logg ut"/>
      </SettingsGroup>

      <div className="text-center text-[10.5px] pt-2" style={{color:"var(--text-3)"}}>
        Familieassistenten · v3.2.1 · <span className="font-mono">build 2026.04.20</span>
      </div>
    </div>
  );
}

/* ------------------ BOTTOM NAV ------------------ */
const tabs = [
  { id: "today",   label: "I dag",    Icon: I.home },
  { id: "cal",     label: "Kalender", Icon: I.calendar },
  { id: "meals",   label: "Ukesmeny", Icon: I.utensils },
  { id: "shop",    label: "Handle",   Icon: I.cart },
  { id: "chores",  label: "Gjøremål", Icon: I.broom },
];

function BottomNav({ tab, setTab }) {
  return (
    <div className="sticky bottom-0 left-0 right-0 z-30 px-3 pb-4 pt-2"
         style={{background:"linear-gradient(180deg, transparent, var(--bg-0) 70%)"}}>
      <div className="tabbar glass-strong rounded-full p-1.5 flex items-center gap-0.5"
           style={{boxShadow:"0 12px 40px -12px oklch(0 0 0 / 0.4)"}}>
        {tabs.map(t => {
          const active = tab === t.id;
          return (
            <button key={t.id} onClick={()=>setTab(t.id)}
                    className={"flex items-center justify-center gap-1.5 py-2.5 rounded-full transition-all whitespace-nowrap "+
                               (active ? "px-3" : "flex-1 px-1")}
                    style={{
                      background: active ? "var(--text-1)" : "transparent",
                      color: active ? "var(--bg-0)" : "var(--text-2)",
                      flex: active ? "0 0 auto" : "1 1 0",
                      minWidth: active ? undefined : 0,
                    }}>
              <t.Icon width="18" height="18"/>
              {active && <span className="text-[12px] font-medium whitespace-nowrap">{t.label}</span>}
            </button>
          );
        })}
        <button className="w-10 h-10 rounded-full flex items-center justify-center ml-0.5 flex-shrink-0"
                style={{background:"linear-gradient(135deg, var(--mint), var(--cyan))", color:"oklch(0.15 0.02 95)",
                        boxShadow:"0 0 20px -4px var(--mint)"}}>
          <I.mic width="17" height="17"/>
        </button>
      </div>
    </div>
  );
}

/* ------------------ DEVICE WRAPPER ------------------ */
function StatusBar() {
  return (
    <div className="flex items-center justify-between px-7 pt-3 pb-1 text-[12px] font-medium" style={{color:"var(--text-1)"}}>
      <span className="font-mono">9:41</span>
      <div className="flex items-center gap-1">
        <svg width="14" height="10" viewBox="0 0 14 10" fill="currentColor"><path d="M1 8h2V6H1v2zm4 0h2V4H5v4zm4 0h2V2H9v6zm4 0h2V0h-2v8z"/></svg>
        <svg width="14" height="10" viewBox="0 0 14 10" fill="currentColor"><path d="M7 1.5a7 7 0 0 1 5 2l-1 1a5.5 5.5 0 0 0-8 0l-1-1a7 7 0 0 1 5-2zm0 3a4 4 0 0 1 2.8 1.2L8.7 6.7a2.5 2.5 0 0 0-3.5 0L4.2 5.7A4 4 0 0 1 7 4.5zm0 3a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/></svg>
        <svg width="22" height="10" viewBox="0 0 22 10" fill="none" stroke="currentColor"><rect x="0.5" y="0.5" width="19" height="9" rx="2"/><rect x="2" y="2" width="14" height="6" fill="currentColor"/><rect x="20" y="3" width="1" height="4" fill="currentColor"/></svg>
      </div>
    </div>
  );
}

/* ------------------ APP ------------------ */
function App() {
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [tab, setTab] = useState(localStorage.getItem("fa:tab") || "today");
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [editMode, setEditMode] = useState(false);

  useEffect(() => { localStorage.setItem("fa:tab", tab); }, [tab]);
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", tweaks.theme);
  }, [tweaks.theme]);

  // Edit mode wiring
  useEffect(() => {
    const onMsg = (e) => {
      const d = e.data || {};
      if (d.type === "__activate_edit_mode") setEditMode(true);
      if (d.type === "__deactivate_edit_mode") setEditMode(false);
    };
    window.addEventListener("message", onMsg);
    window.parent.postMessage({type:"__edit_mode_available"}, "*");
    return () => window.removeEventListener("message", onMsg);
  }, []);

  const update = (patch) => {
    const next = {...tweaks, ...patch};
    setTweaks(next);
    window.parent.postMessage({type:"__edit_mode_set_keys", edits: patch}, "*");
  };

  const view = (
    <>
      <StatusBar/>
      <TopBar
        onSettings={()=>setSettingsOpen(true)}
        theme={tweaks.theme}
        setTheme={(t)=>update({theme:t})}
      />
      {settingsOpen ? (
        <div className="pb-4" data-screen-label="00 Innstillinger">
          <Settings
            onClose={()=>setSettingsOpen(false)}
            familyName={tweaks.familyName}
            setFamilyName={(v)=>update({familyName:v})}
            theme={tweaks.theme}
            setTheme={(t)=>update({theme:t})}
            gamification={tweaks.gamification}
            setGamification={(v)=>update({gamification:v})}
          />
        </div>
      ) : (
        <div className="pb-4" data-screen-label={
          tab==="today" ? "01 Dashboard" :
          tab==="cal"   ? "02 Kalender"  :
          tab==="meals" ? "03 Ukesmeny"  :
          tab==="shop"  ? "04 Handletur" : "05 Gjøremål"
        }>
          {tab==="today" && <Dashboard familyName={tweaks.familyName} onOpenCalendar={()=>setTab("cal")}/>}
        {tab==="cal"   && <Calendar onOpenLink={(l)=>setTab(l==="meals"?"meals":"chores")} onOpenSettings={()=>setSettingsOpen(true)}/>}
        {tab==="meals" && <WeekMenu/>}
        {tab==="shop"  && <Shopping/>}
        {tab==="chores"&& <Chores gamification={tweaks.gamification}/>}
      </div>
      )}
      <BottomNav tab={tab} setTab={setTab}/>
    </>
  );

  return (
    <div className="min-h-screen">
      {/* Desktop: center device frame. Mobile: fullscreen */}
      <div className="md:py-10 md:px-8 md:max-w-[1400px] md:mx-auto">
        <div className="md:hidden">{view}</div>
        <div className="hidden md:grid md:grid-cols-[1fr_auto_1fr] md:gap-10 md:items-start">
          {/* Left column info */}
          <div className="pt-10 space-y-8 pl-4">
            <div>
              <div className="text-[11px] uppercase tracking-[0.22em] mb-3" style={{color:"var(--text-3)"}}>Redesign · April 2026</div>
              <div className="font-display text-[56px] leading-[1.02]" style={{color:"var(--text-1)"}}>
                Familieassistenten, <em className="italic">nytt antrekk</em>.
              </div>
              <div className="text-[15px] mt-4 max-w-[380px]" style={{color:"var(--text-2)"}}>
                En varm, familievennlig omdesign i glassmorphism og subtile neon-aksenter — bygget på dine
                eksisterende funksjoner. Dagens middag, ukesmeny, handletur og et kontrollrom med gamification.
              </div>
            </div>
            <div className="grid grid-cols-2 gap-3 max-w-[420px]">
              {[
                {k:"Aesthetic", v:"Glass · Aurora"},
                {k:"Palette", v:"Mint · Cyan · Warm off-black"},
                {k:"Type", v:"Instrument Serif + Geist"},
                {k:"Platform", v:"Responsiv · iOS-prioritet"},
              ].map(x => (
                <div key={x.k} className="glass rounded-xl p-3">
                  <div className="text-[10px] uppercase tracking-widest" style={{color:"var(--text-3)"}}>{x.k}</div>
                  <div className="text-[13px] mt-1" style={{color:"var(--text-1)"}}>{x.v}</div>
                </div>
              ))}
            </div>
            <div className="glass rounded-xl p-4 max-w-[420px]">
              <div className="text-[11px] uppercase tracking-widest mb-2" style={{color:"var(--text-3)"}}>Naviger</div>
              <div className="grid grid-cols-5 gap-1.5">
                {tabs.map(t => (
                  <button key={t.id} onClick={()=>setTab(t.id)}
                          className={"rounded-lg p-2 flex flex-col items-center gap-1 text-[10.5px] "+
                                     (tab===t.id ? "ring-mint" : "")}
                          style={{background: tab===t.id ? "oklch(0.82 0.15 155 / 0.12)" : "transparent",
                                  color: tab===t.id ? "var(--mint)" : "var(--text-2)"}}>
                    <t.Icon width="17" height="17"/>
                    {t.label}
                  </button>
                ))}
              </div>
            </div>
            <div className="text-[11px]" style={{color:"var(--text-3)"}}>
              Klikk fanene over, eller bruk bunn-tablinjen i telefonen. Åpne Tweaks nede i høyre hjørne for å bytte tema og aksent.
            </div>
          </div>

          {/* Device frame */}
          <div className="flex justify-center">
            <div className="device-frame" style={{width: 400}}>
              <div className="rounded-[36px] overflow-hidden relative" style={{background:"var(--bg-0)", height: 820}}>
                <div className="absolute inset-0 aurora"></div>
                <div className="absolute top-2 left-1/2 -translate-x-1/2 w-[110px] h-[28px] rounded-full z-20"
                     style={{background:"oklch(0.10 0.01 95)"}}></div>
                <div className="relative z-10 h-full overflow-y-auto no-scrollbar flex flex-col">
                  <div className="flex-1">{view}</div>
                </div>
              </div>
            </div>
          </div>

          {/* Right column: screens overview */}
          <div className="pt-10 pr-4 space-y-3">
            <div className="text-[11px] uppercase tracking-[0.22em] mb-3" style={{color:"var(--text-3)"}}>Skjermer</div>
            {[
              {id:"today",  t:"01 — Dashboard", d:"Hilsen, agenda-stripe for i dag, kveldens middag, pantry lavt, AI-forslag."},
              {id:"cal",    t:"02 — Kalender",  d:"Synket med Google/Apple. Dag- og ukesvisning, farger pr. familiemedlem, filter."},
              {id:"meals",  t:"03 — Ukesmeny",  d:"Dag-strip, hero-kort pr. dag, hele uka som liste, generer manglende."},
              {id:"shop",   t:"04 — Handletur", d:"Progress ring, voice-input, kategorier med aksentfarger, 'kjøpt' anim."},
              {id:"chores", t:"05 — Gjøremål",  d:"Dagens oppgaver, hele uka, utsett til i morgen, XP, merker og streaks."},
            ].map((s,i) => (
              <button key={s.id} onClick={()=>setTab(s.id)}
                      className={"glass glass-hl rounded-2xl p-4 w-full text-left lift "+
                                 (tab===s.id ? "ring-mint" : "")}>
                <div className="text-[11px] font-mono" style={{color:"var(--text-3)"}}>0{i+1}</div>
                <div className="font-display text-[20px] mt-1" style={{color:"var(--text-1)"}}>{s.t.split(" — ")[1]}</div>
                <div className="text-[12px] mt-1" style={{color:"var(--text-2)"}}>{s.d}</div>
              </button>
            ))}
          </div>
        </div>
      </div>

      {/* Tweaks trigger */}
      <button onClick={()=>setTweaksOpen(!tweaksOpen)}
              className="fixed bottom-4 right-4 md:bottom-6 md:right-6 z-50 glass-strong rounded-full px-4 py-2 text-[12px] flex items-center gap-1.5"
              style={{color:"var(--text-1)"}}>
        <I.settings width="14" height="14"/> Tweaks
      </button>

      <div className={"tweaks glass-strong rounded-2xl p-4 " + (tweaksOpen ? "open" : "")}>
        <div className="flex items-center justify-between mb-3">
          <div className="font-display text-[18px]">Tweaks</div>
          <button onClick={()=>setTweaksOpen(false)} className="text-[18px]" style={{color:"var(--text-3)"}}>×</button>
        </div>

        <div className="space-y-3">
          <div>
            <div className="text-[10px] uppercase tracking-widest mb-1.5" style={{color:"var(--text-3)"}}>Tema</div>
            <div className="grid grid-cols-2 gap-1.5">
              {["dark","light"].map(t => (
                <button key={t} onClick={()=>update({theme:t})}
                        className={"rounded-lg py-2 text-[12px] capitalize "+(tweaks.theme===t?"ring-mint":"")}
                        style={{background: tweaks.theme===t ? "oklch(0.82 0.15 155 / 0.12)" : "var(--surface)", color:"var(--text-1)", border:"1px solid var(--stroke)"}}>
                  {t==="dark"?"Mørk":"Lys"}
                </button>
              ))}
            </div>
          </div>

          <div>
            <div className="text-[10px] uppercase tracking-widest mb-1.5" style={{color:"var(--text-3)"}}>Familienavn</div>
            <input value={tweaks.familyName} onChange={e=>update({familyName:e.target.value})}
                   className="w-full bg-[var(--surface)] rounded-lg px-3 py-2 text-[13px] outline-none"
                   style={{border:"1px solid var(--stroke)", color:"var(--text-1)"}}/>
          </div>

          <div>
            <div className="text-[10px] uppercase tracking-widest mb-1.5" style={{color:"var(--text-3)"}}>Skjerm</div>
            <div className="grid grid-cols-2 gap-1.5">
              {tabs.map(t => (
                <button key={t.id} onClick={()=>setTab(t.id)}
                        className={"rounded-lg py-2 text-[12px] flex items-center justify-center gap-1.5 "+(tab===t.id?"ring-mint":"")}
                        style={{background: tab===t.id ? "oklch(0.82 0.15 155 / 0.12)" : "var(--surface)", color:"var(--text-1)", border:"1px solid var(--stroke)"}}>
                  <t.Icon width="14" height="14"/>{t.label}
                </button>
              ))}
            </div>
          </div>

          <div className="text-[10px] pt-2" style={{color:"var(--text-3)"}}>
            Bytt tema/skjermer live. Dette er en ren designprototype — ingen data endres.
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
