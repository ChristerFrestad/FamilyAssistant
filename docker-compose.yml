# FamilyAssistant — Portainer GitHub URL deploy (zero-config)
#
# Stacks → Add stack → Repository
#   Repository URL: https://github.com/ChristerFrestad/FamilyAssistant
#   Compose path:   docker-compose.yml
#   Reference:      refs/heads/main
# Deploy with NO environment variables.
# Cloudflare Tunnel service URL: http://192.168.50.123:7777
#
# Image bakes BOOTSTRAP_ALLOWED + safe pilot flags; first boot writes
# AUTH_TOKEN/SESSION_SECRET to the data volume automatically.

services:
  app:
    image: ghcr.io/christerfrestad/familyassistant:main
    pull_policy: always
    container_name: familieassistenten
    restart: unless-stopped
    ports:
      - '7777:7777'
    volumes:
      - familyassistant_data:/app/data
    # Portainer "Environment variables" are compose substitutions only.
    # They do not reach Node unless listed here as ${VAR:-}.
    # Do not set PILOT_BYPASS / MAGIC_LINK_CONSOLE / AUTH_TOKEN /
    # SESSION_SECRET here (image defaults + auto-create).
    environment:
      NODE_ENV: production
      PORT: '7777'
      # Override image default so LAN http://<ip>:7777 can keep the
      # session cookie. TLS proxies still set Secure via X-Forwarded-Proto.
      HTTPS_TERMINATED: ${HTTPS_TERMINATED:-false}
      APP_URL: ${APP_URL:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      MARKETING_HOSTS: ${MARKETING_HOSTS:-}
      MARKETING_CANONICAL: ${MARKETING_CANONICAL:-}
      APP_NAME: ${APP_NAME:-FamilyAssistant}
      APP_NAME_PRIMARY: ${APP_NAME_PRIMARY:-Family}
      APP_NAME_ACCENT: ${APP_NAME_ACCENT:-Assistant}
      APP_FAVICON_LETTER: ${APP_FAVICON_LETTER:-F}
      APP_TAGLINE: ${APP_TAGLINE:-Plan meals, chores and family}
      APP_PRIMARY_COLOR: ${APP_PRIMARY_COLOR:-#1F3F26}
      APP_ACCENT_COLOR: ${APP_ACCENT_COLOR:-#5F8B5C}
      APP_DOT_COLOR: ${APP_DOT_COLOR:-#7BA05B}
      # Integration keys: set in Portainer stack env. Empty default so
      # a stack without them still boots. Do not put secrets in git.
      KASSAL_API_KEY: ${KASSAL_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
    mem_limit: 768m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:7777/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  familyassistant_data:
