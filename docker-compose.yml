# FamilyAssistant — Portainer GitHub URL deploy (zero-config)
#
# Stacks → Add stack → Repository
#   Repository URL: https://github.com/ChristerFrestad/FamilyAssistant
#   Compose path:   docker-compose.yml
#   Reference:      refs/heads/main
# Deploy with NO environment variables.
# Cloudflare Tunnel service URL: http://192.168.50.123:7777
#
# Image bakes BOOTSTRAP_ALLOWED + safe pilot flags; first boot writes
# AUTH_TOKEN/SESSION_SECRET to the data volume automatically.

services:
  app:
    image: ghcr.io/christerfrestad/familyassistant:main
    pull_policy: always
    container_name: familieassistenten
    restart: unless-stopped
    ports:
      - '7777:7777'
    volumes:
      - familyassistant_data:/app/data
    # Minimal overrides only — do not set PILOT_BYPASS / MAGIC_LINK_CONSOLE
    # / AUTH_TOKEN / SESSION_SECRET here (image defaults + auto-create).
    environment:
      NODE_ENV: production
      PORT: '7777'
      # Override image default so LAN http://<ip>:7777 can keep the
      # session cookie. TLS proxies still set Secure via X-Forwarded-Proto.
      HTTPS_TERMINATED: 'false'
    mem_limit: 768m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:7777/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  familyassistant_data:
