# Familieassistenten — Docker Compose
#
# Zero-config deploy: kjør `docker compose up -d` uten variabler, åpne
# http://<host>:3000 i nettleseren, og fullfør setup-wizarden. Serveren
# starter i bootstrap-mode når AUTH_TOKEN og bootstrap.json mangler, og
# generer begge via UI-en. Caddy (HTTPS reverse proxy) er gatet bak
# `--profile production` slik at den ikke startes før brukeren har
# konfigurert domene.
#
# Kjørmåter:
#   docker compose up -d                        # app kun (bootstrap-flyt klar)
#   docker compose --profile production up -d   # app + Caddy (etter bootstrap)
#   docker compose logs -f app                  # følg loggen
#   docker compose down                         # stopp alt
#   docker compose pull                         # oppdater til siste tagget versjon

services:
  # --------------------------------------------------------------------------
  # Familieassistenten — hoved-app
  # --------------------------------------------------------------------------
  app:
    image: ghcr.io/christerfrestad/familyassistant:${TAG:-latest}
    # Kommentere inn nedenfor for lokal build i stedet for GHCR pull:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: familieassistenten
    restart: unless-stopped
    # Direkte LAN-tilgang. Host-porten 13000 er valgt for å unngå kollisjon
    # med andre vanlige self-hosted apper (Grafana og Node-defaults kaprer 3000
    # ofte; n8n bruker 5678; Jellyfin 8096; Sonarr 8989). Intern container-port
    # er fortsatt 3000. Etter bootstrap + Caddy-aktivering kan dette endres til
    # "127.0.0.1:13000:3000" for å tvinge all trafikk via Caddy-reverse-proxy.
    ports:
      - "13000:3000"
    volumes:
      - ./data:/app/data
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      # Bootstrap-modus: hvis AUTH_TOKEN mangler OG /app/data/bootstrap.json
      # mangler OG data-volumet ikke har en DB, starter serveren en
      # setup-wizard på /setup.html. BOOTSTRAP_ALLOWED=true signaliserer
      # at vi er i en container-kontekst der dette er trygt (volum-mount
      # for å persiste valgt token).
      BOOTSTRAP_ALLOWED: "true"
      # AUTH_TOKEN er valgfri ved første deploy — bootstrap-wizarden genererer
      # og persiserer den. Sett her hvis du vil hoppe over wizarden.
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      AUTH_TOKEN_CREATED_AT: ${AUTH_TOKEN_CREATED_AT:-}
      # LLM-backend (valgfritt — single-user kan bruke ollama på host)
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      # Sikkerhet og ytelse
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1048576}
      MEMORY_BUDGET_MB: ${MEMORY_BUDGET_MB:-512}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Settes til "true" først når Caddy står foran (production-profil)
      HTTPS_TERMINATED: ${HTTPS_TERMINATED:-false}
    # Ressursgrenser — reflekterer RPi5 4GB budsjett
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.5"
        reservations:
          memory: 128M
    # Node-distroless har ikke shell, så Docker health depends på
    # HEALTHCHECK-instruksjonen i Dockerfile (node -e fetch('/health'))
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://localhost:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    # For å nå ollama som kjører på host på Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - familieass

  # --------------------------------------------------------------------------
  # Caddy — reverse proxy med HTTPS
  #
  # Gated bak profilen "production". Start kun med:
  #   docker compose --profile production up -d
  # Første-gangs-deploy bør kjøres uten denne profilen slik at bootstrap-
  # wizarden kan gjennomføres på http://<host>:3000. Etter wizarden er
  # ferdig og AUTH_TOKEN persistert, aktiver Caddy og sett
  # HTTPS_TERMINATED=true i .env.
  # --------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: familieass-caddy
    restart: unless-stopped
    profiles:
      - production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - familieass

# ----------------------------------------------------------------------------
# Named volumes
# ----------------------------------------------------------------------------
volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  familieass:
    driver: bridge
