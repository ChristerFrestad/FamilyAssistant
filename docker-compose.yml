# FamilyAssistant — Portainer / Docker (GitHub URL → Deploy)
#
# No secrets. No MAGIC_LINK_CONSOLE. No manual tokens.
# First boot writes AUTH_TOKEN + SESSION_SECRET to the data volume
# and binds 0.0.0.0:7777 for Cloudflare Tunnel.
#
# Portainer: Stacks → Add stack → Repository
#   URL:  https://github.com/ChristerFrestad/FamilyAssistant
#   Path: docker-compose.yml
#   Ref:  refs/heads/main
# Then Deploy. Point tunnel at http://<host>:7777

services:
  app:
    image: ghcr.io/christerfrestad/familyassistant:main
    pull_policy: always
    container_name: familieassistenten
    restart: unless-stopped
    ports:
      - '7777:7777'
    volumes:
      - familyassistant_data:/app/data
    environment:
      NODE_ENV: production
      PORT: '7777'
      BOOTSTRAP_ALLOWED: 'true'
      HTTPS_TERMINATED: 'true'
      TRUST_PROXY: 'true'
      ALLOWED_ORIGINS: '*'
      LOG_LEVEL: info
      # Explicitly off — never require magic-link secrets at deploy time.
      MAGIC_LINK_CONSOLE: 'false'
      PILOT_BYPASS: 'false'
      PILOT_MODE: 'false'
    mem_limit: 768m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:7777/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  familyassistant_data:
