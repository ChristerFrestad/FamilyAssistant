# FamilyAssistant — Docker Compose
#
# Zero-config deploy: run `docker compose up -d` with no variables, open
# http://<host>:7777 in a browser, and finish the setup wizard. The
# server enters bootstrap mode when AUTH_TOKEN is missing and there is
# no persisted /app/data/bootstrap.json, generates both via the UI, and
# restarts into normal mode. Caddy (HTTPS reverse proxy) is gated behind
# `--profile production` so it does not block the first deploy.
#
# Portainer notes:
#   - Paste this file into Stacks → Web editor (or point Repository at
#     this compose path). Named volume `familyassistant_data` works out
#     of the box — relative bind mounts like `./data` resolve against
#     Portainer's working directory and often break.
#   - To bind-mount a host path instead (easier backup via SSH), replace
#     the volumes section with e.g.:
#       - /srv/familyassistant-data:/app/data
#     and `chown -R 1000:1000` that path (node user in the image).
#   - pull_policy: always forces a fresh GHCR pull on every stack deploy
#     (Portainer CE has no separate "Re-pull image" toggle).
#
# Common commands:
#   docker compose up -d                        # app only (bootstrap ready)
#   docker compose --profile production up -d   # app + Caddy (after setup)
#   docker compose logs -f app                  # follow the app logs
#   docker compose down                         # stop everything
#   docker compose pull                         # refresh to latest tagged image

services:
  # --------------------------------------------------------------------------
  # FamilyAssistant — main app
  # --------------------------------------------------------------------------
  app:
    # Default to the :main tag because the Docker workflow only creates
    # :latest on v-tag pushes. :main is built on every push to main and
    # always reflects the current codebase. Pin to :sha-XXXX or a
    # specific :v1.4.0 via the TAG environment variable when you want
    # immutability.
    image: ghcr.io/christerfrestad/familyassistant:${TAG:-main}
    # Force Docker to pull the registry copy on every stack deploy so
    # Portainer CE (which has no "Re-pull image" toggle) still gets
    # fresh bits. Without this, a cached local image silently wins
    # forever.
    pull_policy: always
    # Uncomment below to build from the working tree instead of pulling
    # from GHCR:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: familieassistenten
    restart: unless-stopped
    # Direct LAN access. Port 7777 is used both internally and externally
    # — one port to remember, and it sidesteps 3000 (Grafana, generic
    # Node defaults), 5678 (n8n), 8096 (Jellyfin), 8989 (Sonarr).
    # Caveat: Ombi also defaults to 7777. If you run Ombi, override the
    # host-side mapping via a stack env var or edit the left half of the
    # mapping to something free (e.g. "8765:7777").
    #
    # After bootstrap + Caddy activation this can be narrowed to
    # "127.0.0.1:7777:7777" to funnel all traffic through the reverse
    # proxy.
    #
    # IMPORTANT (Portainer): use a plain mapping, not ${HOST_PORT:-7777}.
    # Portainer CE stack env substitution often turns missing HOST_PORT
    # into an empty left-hand side (" :7777") which fails to publish any
    # port. Override host port by editing this line (e.g. "8765:7777").
    ports:
      - '7777:7777'
    volumes:
      # Named volume — Portainer-safe. See header comment for bind-mount.
      - familyassistant_data:/app/data
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Internal server listen-port. The Dockerfile bakes in PORT=7777 so
      # this is redundant but explicit, and protects against stale images
      # that still default to 3000.
      PORT: '7777'
      # Bootstrap mode: when AUTH_TOKEN is missing AND
      # /app/data/bootstrap.json is missing, the server boots the setup
      # wizard at /setup.html (also recovers when a DB already exists
      # but secrets were never persisted — prevents crash-loop / empty
      # Published Ports in Portainer).
      BOOTSTRAP_ALLOWED: 'true'
      # AUTH_TOKEN is optional on first deploy — the wizard generates
      # and persists it. Set this variable to skip the wizard.
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      # SESSION_SECRET is also optional on first deploy — generated
      # alongside AUTH_TOKEN by the setup wizard and persisted to
      # bootstrap.json. Upgrading installs that pre-date multi-tenant
      # activation get it self-healed on next boot. Override here only
      # if you want to rotate it manually.
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Quoted so bare `*` is not a YAML alias token.
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-*}'
      AUTH_TOKEN_CREATED_AT: ${AUTH_TOKEN_CREATED_AT:-}
      # LLM backend (optional — a single-family deploy can use Ollama
      # running on the host).
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      # Security and performance
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1048576}
      MEMORY_BUDGET_MB: ${MEMORY_BUDGET_MB:-512}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Set to "true" once Caddy is in front (production profile)
      HTTPS_TERMINATED: ${HTTPS_TERMINATED:-false}
      # Pilot/MVP escape hatches. Default off. Set from the Portainer stack
      # env-vars (or a .env file next to docker-compose.yml) to enable.
      # See .env.example for the full documentation.
      PILOT_BYPASS: ${PILOT_BYPASS:-false}
      PILOT_BYPASS_PRODUCTION_ACK: ${PILOT_BYPASS_PRODUCTION_ACK:-false}
      MAGIC_LINK_CONSOLE: ${MAGIC_LINK_CONSOLE:-false}
      # Absolute URL the server uses when building e.g. magic-link verify
      # URLs. Leave empty for LAN-only pilot deploys (URLs stay relative).
      APP_URL: ${APP_URL:-}
      # Sprint 7 / pilot 13–17 May 2026. Pre-auth password gate (Christer
      # sets PILOT_MODE=true and PILOT_PASSWORD in Portainer for the
      # pilot window; both unset post-pilot to disable the gate). See
      # docs/analyses/2026-05-04-pilot-password-protection.md.
      PILOT_MODE: ${PILOT_MODE:-false}
      PILOT_PASSWORD: ${PILOT_PASSWORD:-}
      # Admin bootstrap. When set, the user whose email matches becomes
      # admin (is_admin=1) on first onboarding. Unset → first user wins.
      # See docs/analyses/2026-05-04-admin-role-bootstrap.md.
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      # Email delivery via Resend. Required for magic-link in production.
      # When unset (or MAGIC_LINK_CONSOLE=true), magic-links print to the
      # container log instead.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      # Kassal price-comparison. Optional opt-in; when unset the enricher
      # runs in no-op mode. Activates post-pilot per audit § C3.
      KASSAL_API_KEY: ${KASSAL_API_KEY:-}
      # White-label override (e.g. Husby — the canonical example).
      # Defaults to "FamilyAssistant" if unset.
      APP_NAME: ${APP_NAME:-FamilyAssistant}
      APP_NAME_PRIMARY: ${APP_NAME_PRIMARY:-Family}
      APP_NAME_ACCENT: ${APP_NAME_ACCENT:-Assistant}
      APP_FAVICON_LETTER: ${APP_FAVICON_LETTER:-F}
      APP_TAGLINE: ${APP_TAGLINE:-Plan meals, chores and family}
      # Trust X-Forwarded-* when behind Cloudflare Tunnel / Caddy / nginx.
      TRUST_PROXY: ${TRUST_PROXY:-false}
    # Resource limits — sized for an RPi5 4 GB host.
    # Note: `deploy.resources` is honoured by Swarm; on plain Compose /
    # Portainer CE it is informational unless you also set mem_limit.
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.5'
        reservations:
          memory: 128M
    # 768m: sharp + better-sqlite3 + Node can peak above 512m on cold
    # start on RPi5; OOM-kill looks exactly like "no Published Ports".
    mem_limit: 768m
    cpus: 1.5
    # The slim runtime has node on PATH. The Docker healthcheck calls
    # node -e with a fetch to /health. Matches the HEALTHCHECK directive
    # in Dockerfile. Prior distroless-only path (/nodejs/bin/node) caused
    # "unhealthy" status on the slim image and hid port 7777 in Portainer.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:7777/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    # Lets the container reach a Linux host's Ollama instance.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - familieass

  # --------------------------------------------------------------------------
  # Caddy — reverse proxy with HTTPS
  #
  # Gated behind the "production" profile. Start only with:
  #   docker compose --profile production up -d
  # First-time deploys should run WITHOUT this profile so the bootstrap
  # wizard can be reached at http://<host>:7777/setup.html. Once the
  # wizard completes and AUTH_TOKEN is persisted, activate Caddy and set
  # HTTPS_TERMINATED=true.
  #
  # Portainer Web editor does not expose compose profiles. Either:
  #   - remove the `profiles:` key under caddy after bootstrap, or
  #   - run Caddy / Cloudflare Tunnel as a separate stack.
  # --------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: familieass-caddy
    restart: unless-stopped
    profiles:
      - production
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - familieass

# ----------------------------------------------------------------------------
# Named volumes
# ----------------------------------------------------------------------------
volumes:
  familyassistant_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  familieass:
    driver: bridge
