name: Deploy to Railway

# Phase 19 — auto-deploy the cloud instance after CI passes on main.
#
# Trigger: workflow_run on the CI workflow. We only proceed when:
#   - CI finished with conclusion=success
#   - the triggering event was a push (not a PR run)
#   - the branch is main (tags, feature branches ignored)
#
# Requires a Railway project token stored as repo secret RAILWAY_TOKEN.
# See DEPLOY.md §15 for how to mint one. No token → the job fails fast
# with a clear message instead of silently skipping.

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: 'Force deploy even if CI run is not found'
        required: false
        default: 'false'

permissions:
  contents: read
  deployments: write

concurrency:
  # Cancel in-flight deploys so we never ship a superseded commit.
  group: deploy-railway
  cancel-in-progress: true

jobs:
  guard:
    name: Verify CI passed
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve commit SHA
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: guard
    environment:
      name: production
      url: ${{ vars.APP_URL || 'https://appdomene.no' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}
          fetch-depth: 1

      - name: Fail fast if RAILWAY_TOKEN is missing
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN secret is not configured. See DEPLOY.md §15."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --detach --ci
          echo "Deploy triggered. Health check will run on the service container."

      - name: Verify /health after deploy
        if: vars.APP_URL != ''
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          # Give the container up to 2 minutes to come up and pass /health.
          for i in $(seq 1 24); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$APP_URL/health" || true)
            if [ "$code" = "200" ]; then
              echo "✅ /health OK after ${i}0s"
              exit 0
            fi
            echo "waiting for /health (try $i/24, got $code)..."
            sleep 5
          done
          echo "::error::/health did not return 200 within 2 minutes"
          exit 1
