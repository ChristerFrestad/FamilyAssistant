name: Release

# Trigges når en tag 'v*' pushes (f.eks. v1.3.0)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Bygg artifacts (tarball + SBOM) - output hashes for SLSA provenance
  # ---------------------------------------------------------------------------
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CI gates (lint/format/test)
        run: npm run ci

      - name: Generate SBOM
        run: npm run sbom

      - name: Create source tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PREFIX="familieassistenten-${VERSION}"
          git archive --format=tar.gz --prefix="${PREFIX}/" -o "${PREFIX}.tar.gz" HEAD
          ls -la *.tar.gz

      - name: Compute SHA256 hashes
        id: hash
        run: |
          set -euo pipefail
          # Hash alle release-artifacts til base64 av "sha256  filename"-liste
          # (format som SLSA provenance-generatoren forventer)
          HASHES=$(sha256sum *.tar.gz sbom.json | base64 -w0)
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"
          sha256sum *.tar.gz sbom.json > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ github.ref_name }}
          path: |
            familieassistenten-*.tar.gz
            sbom.json
            SHA256SUMS.txt
          retention-days: 90

  # ---------------------------------------------------------------------------
  # 2. SLSA Level 3 provenance - kryptografisk signert build-herkomst
  # Bruker GitHub's generic generator (OIDC-basert, ingen nøkler i repo).
  # ---------------------------------------------------------------------------
  provenance:
    name: Generate SLSA provenance
    needs: build
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: false
      provenance-name: familieassistenten-${{ github.ref_name }}.intoto.jsonl

  # ---------------------------------------------------------------------------
  # 3. Publiser GitHub Release med alle artifacts og provenance
  # ---------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, provenance]
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-${{ github.ref_name }}
          path: ./release

      - name: Download provenance
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: ./release

      - name: List release contents
        run: ls -la ./release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ./release/familieassistenten-*.tar.gz
            ./release/sbom.json
            ./release/SHA256SUMS.txt
            ./release/*.intoto.jsonl
          body: |
            ## Familieassistenten ${{ github.ref_name }}

            ### Verifiser integritet

            ```bash
            # Sjekk SHA256-summer
            sha256sum -c SHA256SUMS.txt

            # Verifiser SLSA provenance (krever slsa-verifier installert)
            slsa-verifier verify-artifact \
              --provenance-path familieassistenten-${{ github.ref_name }}.intoto.jsonl \
              --source-uri github.com/${{ github.repository }} \
              familieassistenten-*.tar.gz
            ```

            ### Software Bill of Materials

            `sbom.json` inneholder full CycloneDX 1.6 SBOM for alle runtime-avhengigheter.
            Se `SECURITY.md §4` for supply-chain-policy.
