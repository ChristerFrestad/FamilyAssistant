name: Release

# Triggered when a tag 'v*' is pushed (e.g. v1.3.0)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build artifacts (tarball + SBOM) - output hashes for SLSA provenance
  # ---------------------------------------------------------------------------
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CI gates (lint/format/test)
        run: npm run ci

      - name: Generate SBOM
        run: npm run sbom

      - name: Create source tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PREFIX="familyassistant-${VERSION}"
          git archive --format=tar.gz --prefix="${PREFIX}/" -o "${PREFIX}.tar.gz" HEAD
          ls -la *.tar.gz

      - name: Compute SHA256 hashes
        id: hash
        run: |
          set -euo pipefail
          # Hash every release artifact into a base64 of "sha256  filename"
          # entries (the format the SLSA provenance generator expects).
          HASHES=$(sha256sum *.tar.gz sbom.json | base64 -w0)
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"
          sha256sum *.tar.gz sbom.json > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-${{ github.ref_name }}
          path: |
            familyassistant-*.tar.gz
            sbom.json
            SHA256SUMS.txt
          retention-days: 90

  # ---------------------------------------------------------------------------
  # 2. SLSA Level 3 provenance - cryptographically signed build attestation
  # Uses GitHub's generic generator (OIDC-based, no keys in repo).
  # ---------------------------------------------------------------------------
  provenance:
    name: Generate SLSA provenance
    needs: build
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: false
      provenance-name: familyassistant-${{ github.ref_name }}.intoto.jsonl
      # PR 7 of public-repo-prep flipped this to false because the repo
      # is now public. With a public repo the SLSA generator does the
      # standard Sigstore Rekor logging without needing the
      # private-repository opt-in. Keep the line as a documentation
      # marker so a future privacy-flip back to private is explicit.
      private-repository: false

  # ---------------------------------------------------------------------------
  # 3. Publish GitHub Release with all artifacts and provenance
  # ---------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, provenance]
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts-${{ github.ref_name }}
          path: ./release

      - name: Download provenance
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: ./release

      - name: List release contents
        run: ls -la ./release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ./release/familyassistant-*.tar.gz
            ./release/sbom.json
            ./release/SHA256SUMS.txt
            ./release/*.intoto.jsonl
          body: |
            ## FamilyAssistant ${{ github.ref_name }}

            ### Verify integrity

            ```bash
            # Check SHA256 sums
            sha256sum -c SHA256SUMS.txt

            # Verify SLSA provenance (requires slsa-verifier installed)
            slsa-verifier verify-artifact \
              --provenance-path familyassistant-${{ github.ref_name }}.intoto.jsonl \
              --source-uri github.com/${{ github.repository }} \
              familyassistant-*.tar.gz
            ```

            ### Software Bill of Materials

            `sbom.json` contains the full CycloneDX 1.6 SBOM for all runtime dependencies.
            See `SECURITY.md §4` for supply-chain policy.
