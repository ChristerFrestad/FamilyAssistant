name: CI

# 2026-04-20: restructured per CLAUDE.md DEL 5.2 (Lokal-først arbeidsflyt).
#
# Volume reduction: from ~300 GH-Actions jobs/day (8-10 × 7-10 pushes) to
# ~1-2 PR-pushes/week (batch-push) × PR-cheap jobs + ~1-2 main merges/week
# × cross-platform matrix + ~1 Sunday cron for OSV/SBOM. Target: ~75-90 %
# reduction in compute without loss of safety.
#
# Trigger policy:
#   - pull_request: minimal PR-gate (Linux Node 20 only)
#   - push to main:  full cross-platform matrix (4 combos)
#   - schedule:      Sunday 02:00 UTC weekly — OSV vulnerability + SBOM
#                    generation (both are heavy and don't need per-PR runs)
#
# Branch-protection job names preserved so existing required-status-checks
# keep matching:
#   - "Test (Node 20.x, ubuntu-latest)" — always runs, is the PR gate
#   - "Test (Node 20.x, macos-latest)" / "... windows-latest" / "... 22.x" —
#     run only on main-push or schedule
#   - "Coverage gate" — always runs (small, important)
#   - "Security audit" — always runs (cheap)
#   - "SBOM generation" + "OSV vulnerability scan" — main-push + schedule only

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Sunday 02:00 UTC — weekly OSV/SBOM. See CLAUDE.md DEL 5.2.4.
    - cron: '0 2 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # PR-gate: Linux Node 20 only. Runs on EVERY trigger. This is the single
  # required status check for PR merge per branch protection.
  # ---------------------------------------------------------------------------
  test:
    name: Test (Node 20.x, ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint flat config)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Run tests (node --test)
        run: npm test
        env:
          NODE_ENV: test

  # ---------------------------------------------------------------------------
  # Cross-platform matrix: only runs on push to main or scheduled. Catches
  # OS-specific regressions (path separator, CRLF, better-sqlite3 native
  # build) without burning runner minutes on every PR-push.
  # ---------------------------------------------------------------------------
  test-cross-platform:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: 'macos-latest',   node: '20.x' }
          - { os: 'windows-latest', node: '20.x' }
          - { os: 'ubuntu-latest',  node: '22.x' }

    steps:
      # Uke 7 PORT-4: sett global autocrlf=false FØR checkout slik at
      # actions/checkout ikke konverterer LF→CRLF på Windows. .gitattributes
      # er backup hvis dette steget uteblir, men runner-git bruker global
      # config først.
      - name: Configure git line endings (Windows) - pre-checkout
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
        shell: bash

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint flat config)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format

      - name: Run tests (node --test)
        run: npm test
        env:
          NODE_ENV: test

  # ---------------------------------------------------------------------------
  # Test coverage med gate (feiler hvis lines/branches/functions faller).
  # Baseline 2026-04-10: 83.26% lines, 71.23% branches, 75.83% functions.
  # Terskler i scripts/coverage-gate.js: 80% / 68% / 72%. Kjører på PR + main.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run coverage with gate
        run: npm run test:coverage:gate 2>&1 | tee coverage.txt
        env:
          NODE_ENV: test

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-node20
          path: coverage.txt
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Security: npm audit på runtime-deps (ikke dev, siden de ikke er i prod).
  # Billig sjekk — kjører alltid.
  # ---------------------------------------------------------------------------
  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies (fail on high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit including dev (informational)
        run: npm audit --audit-level=moderate
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # SBOM (Software Bill of Materials) — CycloneDX 1.6, runtime-only.
  # Kjører KUN ved merge til main og ved ukentlig cron (tung, trenger ikke
  # kjøres per PR). Publiseres som build-artifact.
  # ---------------------------------------------------------------------------
  sbom:
    name: SBOM generation
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate runtime SBOM (CycloneDX JSON)
        run: npm run sbom

      - name: Generate full SBOM (inkl. dev-deps, informational)
        run: npm run sbom:full
        continue-on-error: true

      - name: Verify SBOM structure
        run: |
          node -e "
          const s = JSON.parse(require('fs').readFileSync('sbom.json', 'utf8'));
          if (s.bomFormat !== 'CycloneDX') { console.error('FEIL: ikke CycloneDX format'); process.exit(1); }
          if (!s.components || s.components.length === 0) { console.error('FEIL: ingen komponenter i SBOM'); process.exit(1); }
          console.log('OK: SBOM ' + s.specVersion + ', ' + s.components.length + ' komponenter');
          "

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx-${{ github.sha }}
          path: |
            sbom.json
            sbom-full.json
          retention-days: 90

  # ---------------------------------------------------------------------------
  # OSV-Scanner — Google's Open Source Vulnerabilities database.
  # Kjører KUN ved merge til main og ved ukentlig cron (tung fetch mot OSV
  # feed, irrelevant for features-branch-pushes).
  # ---------------------------------------------------------------------------
  osv-scan:
    name: OSV vulnerability scan
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.5
        with:
          scan-args: |-
            --lockfile=package-lock.json
            --format=sarif
            --output=osv-results.sarif
        continue-on-error: true

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: osv-results.sarif
        continue-on-error: true

      - name: Upload OSV artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: osv-scan-results
          path: osv-results.sarif
          retention-days: 30

      - name: Fail on HIGH/CRITICAL vulnerabilities
        run: |
          if [ -f osv-results.sarif ]; then
            HIGH_COUNT=$(node -e "
              try {
                const s = JSON.parse(require('fs').readFileSync('osv-results.sarif','utf8'));
                const results = (s.runs?.[0]?.results || []);
                const high = results.filter(r => {
                  const level = r.level || 'warning';
                  return level === 'error';
                });
                console.log(high.length);
              } catch (e) { console.log(0); }
            ")
            if [ "$HIGH_COUNT" -gt 0 ]; then
              echo "::error::OSV-Scanner fant $HIGH_COUNT HIGH/CRITICAL sårbarheter"
              exit 1
            fi
            echo "OK: ingen HIGH/CRITICAL sårbarheter i OSV-feed"
          fi
