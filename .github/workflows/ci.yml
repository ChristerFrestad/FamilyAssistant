name: CI

# 2026-04-20: restructured per CLAUDE.md DEL 5.2 (Lokal-først arbeidsflyt).
#
# Temporary for PR #191: no package-lock.json + npm install (not ci) + prettier auto-fix.
# Revert to npm ci + cache: npm after merge and lockfile regen.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node 20.x, ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: |
          npm install
          npm rebuild better-sqlite3

      - name: Lint (ESLint flat config)
        run: npm run lint

      - name: Format check (Prettier)
        run: |
          npx prettier --write "server/**/*.js" "scripts/**/*.js" "tests/**/*.js" "public/sw.js" "package.json"
          npm run format

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Run tests (node --test)
        run: npm test
        env:
          NODE_ENV: test

  test-cross-platform:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: 'macos-latest',   node: '20.x' }
          - { os: 'windows-latest', node: '22.x' }
          - { os: 'ubuntu-latest',  node: '22.x' }

    steps:
      - name: Configure git line endings (Windows) - pre-checkout
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
        shell: bash

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: |
          npm install
          npm rebuild better-sqlite3

      - name: Run tests (node --test)
        run: npm test
        env:
          NODE_ENV: test

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
      - name: Install
        run: |
          npm install
          npm rebuild better-sqlite3
      - name: Coverage
        run: npm run test:coverage:gate
        env:
          NODE_ENV: test

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
      - name: Install
        run: |
          npm install
          npm rebuild better-sqlite3
      - name: Audit
        run: npm run audit:prod

  sbom:
    name: SBOM generation
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
      - name: Install
        run: |
          npm install
          npm rebuild better-sqlite3
      - name: SBOM
        run: npm run sbom

  osv:
    name: OSV vulnerability scan
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
      - name: Install
        run: |
          npm install
          npm rebuild better-sqlite3
      - name: OSV
        run: npx osv-scanner --lockfile=package-lock.json || true
