name: Docker

# Week 7 PORT-3: Build and publish a multi-arch (amd64 + arm64) image
# to GitHub Container Registry (ghcr.io).
#
# Triggers:
#   - push to main → ghcr.io/{owner}/familyassistant:main + :<sha>
#   - tag v* → ghcr.io/{owner}/familyassistant:1.3.0 + :latest
#   - PR changing Dockerfile → build without push for validation
#   - workflow_dispatch → manual build for testing
#
# Authentication: GITHUB_TOKEN has write access to ghcr.io for the
# repo owner. No additional secrets required.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'server/**'
      - 'public/**'
      - 'client/**'
      - 'scripts/load-baseline.js'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'client/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/familyassistant

jobs:
  build-and-push:
    name: Build multiarch + push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # main-branch push → :main + :sha-XXXX
            type=ref,event=branch
            type=sha,prefix=sha-
            # tag push → :1.3.0 + :1.3 + :latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=FamilyAssistant
            org.opencontainers.image.description=Self-hosted household assistant
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push multiarch
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=familyassistant
          cache-to: type=gha,mode=max,scope=familyassistant
          provenance: mode=max
          sbom: true

      # Build amd64 image into the local Docker daemon so we can introspect
      # the resulting filesystem. Reuses the cache from the multiarch build
      # above — the amd64 stages are already computed, this just exports them
      # to a loadable image. Costs ~10-30 sec extra.
      - name: Build amd64 for in-image verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: familyassistant:verify
          cache-from: type=gha,scope=familyassistant

      # Verify that the v2 React bundle is actually present in the image.
      # This is the regression-guard for the 2026-05-04 incident where
      # the production image shipped without public/v2/ (because Vite was
      # never run in the build), causing visitors to see legacy v1 instead
      # of the PilotPasswordGate. If frontend-builder ever stops producing
      # the bundle, this step fails the build and prevents a broken image
      # from reaching ghcr.io.
      - name: Verify v2 bundle in image
        run: |
          set -euo pipefail
          echo "### V2 bundle verification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo '#### `/app/public/v2/`' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          docker run --rm --entrypoint ls familyassistant:verify -la /app/public/v2/ \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo '#### `/app/public/v2/assets/`' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          docker run --rm --entrypoint ls familyassistant:verify -la /app/public/v2/assets/ \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # Hard-fail if essentials are missing.
          docker run --rm --entrypoint test familyassistant:verify -f /app/public/v2/index.html
          docker run --rm --entrypoint sh familyassistant:verify -c \
            'ls /app/public/v2/assets/main-*.js >/dev/null 2>&1 && \
             ls /app/public/v2/assets/main-*.css >/dev/null 2>&1'
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Bundle verified — index.html + main-*.js + main-*.css present." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: success()
        run: |
          echo "### Docker build summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "_PR build - image NOT pushed to registry._" >> $GITHUB_STEP_SUMMARY
          fi
