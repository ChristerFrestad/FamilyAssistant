# FamilyAssistant logrotate configuration
#
# Week 6 of the ISO/IEC 25010 plan (OBS-4). Used when the operator
# chooses to write pino logs to a file instead of journald.
#
# Install on RPi5:
#   sudo cp docs/monitoring/logrotate.conf /etc/logrotate.d/familieassistenten
#   sudo chmod 644 /etc/logrotate.d/familieassistenten
#   sudo logrotate -d /etc/logrotate.d/familieassistenten  # dry-run
#
# The default for v1.3+ is journald (systemd) with retention controlled
# via /etc/systemd/journald.conf (MaxRetentionSec=14day, Compress=yes).
#
# If you prefer file-based logging instead of journald, set
#   StandardOutput=append:/var/log/familieassistenten.log
#   StandardError=append:/var/log/familieassistenten.log
# in familieassistenten.service and activate this logrotate config.

/var/log/familieassistenten.log /var/log/familieassistenten-*.log {
    # Rotate daily
    daily

    # Keep 14 days (SLO in RUNBOOK §10)
    rotate 14

    # gzip after 3 days (faster file operations on the fresh log)
    compress
    delaycompress

    # Do not fail if the file is missing
    missingok

    # Do not rotate an empty file
    notifempty

    # Copy + truncate instead of rename - Node.js does not need SIGHUP
    # because pino-append reopens the file per write
    copytruncate

    # Set correct owner after rotation
    create 0640 pi pi

    # Date suffix instead of a number
    dateext
    dateformat -%Y-%m-%d

    # Prune old files
    maxage 14

    # Post-rotate hook to reopen file handles (not needed with copytruncate
    # but documented for alternative setups)
    # postrotate
    #     systemctl reload familieassistenten > /dev/null 2>&1 || true
    # endscript
}
