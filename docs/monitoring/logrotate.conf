# Familieassistenten logrotate-konfigurasjon
#
# Uke 6 av ISO/IEC 25010-planen (OBS-4). Brukes hvis operatør velger å
# skrive pino-logger til fil i stedet for journald.
#
# Installasjon på RPi5:
#   sudo cp docs/monitoring/logrotate.conf /etc/logrotate.d/familieassistenten
#   sudo chmod 644 /etc/logrotate.d/familieassistenten
#   sudo logrotate -d /etc/logrotate.d/familieassistenten  # dry-run
#
# Standard for v1.3+ er journald (systemd) med retention styrt via
# /etc/systemd/journald.conf (MaxRetentionSec=14day, Compress=yes).
#
# Hvis du ønsker fil-basert logging i stedet for journald, sett
#   StandardOutput=append:/var/log/familieassistenten.log
#   StandardError=append:/var/log/familieassistenten.log
# i familieassistenten.service, og aktiver denne logrotate-konfigen.

/var/log/familieassistenten.log /var/log/familieassistenten-*.log {
    # Rotate daglig
    daily

    # Behold 14 dager (SLO i RUNBOOK §10)
    rotate 14

    # Gzip etter 3 dager (raskere filoperasjoner på fersk logg)
    compress
    delaycompress

    # Ikke feil hvis fil mangler
    missingok

    # Ikke roter tom fil
    notifempty

    # Kopier + trunkér i stedet for rename — Node.js trenger ikke SIGHUP
    # ettersom pino-append åpner fil per write
    copytruncate

    # Sett riktig eier etter rotasjon
    create 0640 pi pi

    # Date-suffix i stedet for nummer
    dateext
    dateformat -%Y-%m-%d

    # Prune gamle filer
    maxage 14

    # Post-rotate hook for å re-opene filhåndtak (ikke nødvendig med copytruncate,
    # men dokumentert for alternative setups)
    # postrotate
    #     systemctl reload familieassistenten > /dev/null 2>&1 || true
    # endscript
}
